<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ellas Forscherlager</title>
<meta name="theme-color" content="#CDEBFF">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  /* Ellas Forscherlager (09.11.2026, Kapitel 7 „Neue Ufer“): Inselkarte lesen und Forscher-Tagebuch – auf der Heimatinsel und jedem Nachbar-Eiland */
  html, body { min-height: 100%; }
  body { background: linear-gradient(#CDEBFF 0 40%, #F6E7C1 40% 100%); background-attachment: fixed; }
  .oben { display: flex; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .oben h1 { margin: 0; font-size: 1.8rem; flex: 1; min-width: 0; }
  @media (max-width: 480px) { .oben h1 { font-size: 1.3rem; } }
  .rund { width: 56px; padding: 0; font-size: 1.6rem; flex: none; text-decoration: none; }
  .mitte { max-width: 1040px; margin: 0 auto; padding: 10px 16px 30px; display: grid; gap: 14px; }
  .ella { display: flex; gap: 12px; align-items: center; }
  .ella .figur { font-size: 3.4rem; flex: none; }
  .blase { background: #fff; border-radius: 24px; padding: 12px 18px; font-size: 1.25rem; font-weight: 500; box-shadow: 0 6px 0 #3B1F63; flex: 1; display: flex; gap: 10px; align-items: center; }
  .blase p { margin: 0; flex: 1; line-height: 1.35; }
  .ru { display: block; font-size: 1rem; font-weight: 500; color: var(--pflaume-hell); margin-top: 4px; }
  .vorlesen { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--himmel); font-size: 1.5rem; }
  .vorlesen.klein { width: 44px; height: 44px; font-size: 1.2rem; vertical-align: middle; }
  .reiter { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .reiter button { min-height: 52px; padding: 0 20px; border-radius: 999px; border: 4px solid #3B1F63; background: #fff; font-weight: 700; font-size: 1.15rem; box-shadow: 0 5px 0 #3B1F63; }
  .reiter button.an { background: #FFD84D; }
  .karte { background: #fff; border-radius: 28px; padding: 16px; border: 4px solid #3B1F63; box-shadow: 0 6px 0 #3B1F63; display: grid; gap: 12px; text-align: center; }
  .karte h2 { margin: 0; }
  .karte[hidden], .zu-oder[hidden], #bereich[hidden] { display: none; }
  .frage { margin: 0; font-size: 1.3rem; font-weight: 700; }
  .stand { margin: 0; font-weight: 700; color: var(--pflaume-hell); }
  .hinweis { min-height: 1.6em; font-size: 1.15rem; font-weight: 600; margin: 0; }
  .hinweis.gut { color: #2E9C5A; } .hinweis.nein { color: #C2337A; }
  .optionen { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }
  .wahl-knopf { min-height: 64px; border-radius: 20px; border: 4px solid #3B1F63; background: #fff; font: inherit; font-weight: 700; font-size: 1.15rem; color: var(--pflaume); display: grid; place-items: center; gap: 2px; padding: 8px; box-shadow: 0 5px 0 #3B1F63; }
  .wahl-knopf .gross { font-size: 2rem; line-height: 1.1; }
  .wahl-knopf.an { background: #FFD84D; }
  .wahl-knopf.richtig { background: #9BE38A; } .wahl-knopf.falsch { opacity: .35; }
  /* Inselkarte: SVG mit Gelände, darüber die Orte als Zeichen (Begleiter als Zeichnung, nie als Emoji) */
  .karte-rahmen { position: relative; width: 100%; max-width: 520px; margin: 0 auto; aspect-ratio: 1; }
  .karte-rahmen svg { width: 100%; height: 100%; display: block; border-radius: 20px; }
  .karte-rahmen .ort { position: absolute; transform: translate(-50%, -50%); font-size: 1.5rem; line-height: 1; pointer-events: none; }
  .karte-rahmen .ort.klein { font-size: 1.1rem; }
  .karte-rahmen .ort.gesucht { outline: 4px solid #FF6F61; outline-offset: 3px; border-radius: 50%; }
  @media (max-width: 480px) { .karte-rahmen .ort { font-size: 1.15rem; } .karte-rahmen .ort.klein { font-size: .9rem; } }
  .legende { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; font-size: 1rem; font-weight: 600; }
  .legende span { white-space: nowrap; }
  /* Tagebuch */
  .funde { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
  .arten { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .eilande { display: grid; gap: 8px; text-align: left; }
  .eiland { display: flex; gap: 10px; align-items: center; background: #F6F3FB; border-radius: 16px; padding: 8px 12px; }
  .eiland .e { font-size: 1.8rem; }
  .eiland.hier { background: #FFF3C4; }
  .klein { margin: 0; font-size: 1rem; color: var(--pflaume-hell); }
  .knoepfe { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .knoepfe a { text-decoration: none; }
  .zu-oder { text-align: center; }
  @media (max-width: 620px) { .arten { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<div class="oben">
  <a class="knopf rund" href="../welt3d/heimat.html" aria-label="Zurück zur Insel">⬅️</a>
  <h1>🧭 Ellas Forscherlager</h1>
  <div class="knopf sterne">⭐ <b id="sterne">0</b></div>
</div>
<main class="mitte">
  <section class="ella">
    <div class="figur" aria-hidden="true">&#xE102;</div>
    <div class="blase"><p id="ella-text"></p><button class="vorlesen" id="ella-vorlesen" aria-label="Vorlesen">🔊</button></div>
  </section>
  <nav class="reiter" id="reiter" role="tablist">
    <button data-reiter="karte" role="tab" class="an" aria-selected="true">🗺️ Karte lesen</button>
    <button data-reiter="tagebuch" role="tab" aria-selected="false">📔 Forscher-Tagebuch</button>
  </nav>
  <div id="bereich"></div>
  <section class="zu-oder" id="zu" hidden>
    <div class="blase" style="justify-content:center"><p id="zu-text">🔒 Das Forscherlager ist noch zu.</p></div>
  </section>
</main>

</html>
