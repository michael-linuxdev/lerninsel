<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lesen und Schreiben</title>
<meta name="theme-color" content="#E8F4FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  body { background: #E8F4FF; background-image: none; --grund: #E8F4FF; --akzent: #3AA0E0; }
  .ansicht[hidden] { display: none !important; }
  .oben { display: flex; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .oben h1 { margin: 0; font-size: 1.7rem; flex: 1; min-width: 0; }
  .rund { width: 56px; padding: 0; font-size: 1.6rem; flex: none; text-decoration: none; }
  main { max-width: 980px; margin: 0 auto; padding: 14px 16px 40px; }
  .schatten { box-shadow: 0 7px 0 rgba(58,160,224,.22); }

  .erzaehler { display: flex; align-items: flex-end; gap: 12px; margin: 6px 0 16px; }
  .erzaehler .fipsi { width: 110px; height: 110px; flex: none; }
  .blase { background: #fff; border-radius: 22px; padding: 14px 18px; font-size: 1.25rem; line-height: 1.35; box-shadow: 0 5px 0 rgba(58,160,224,.22); flex: 1; }
  .ton { border: 0; background: #CDE8FB; border-radius: 999px; font-size: 1.4rem; width: 48px; height: 48px; cursor: pointer; flex: none; }

  .wege { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .weg { background: #fff; border: 0; border-radius: 26px; padding: 18px 10px; font: inherit; font-weight: 600; font-size: 1.15rem; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 7px 0 rgba(58,160,224,.22); cursor: pointer; color: inherit; }
  .weg .emoji { font-size: 3rem; }
  .weg small { font-weight: 400; color: #4a6f8a; }
  .weg:active { transform: translateY(3px); }
  .weg[hidden] { display: none; }
  .weg.tipp { box-shadow: 0 0 0 5px #3AA0E0, 0 7px 0 rgba(58,160,224,.22); }
  .stand { text-align: center; margin: 18px 0 0; font-size: 1.1rem; }
  @media (max-width: 640px) { .erzaehler .fipsi { width: 80px; height: 80px; } .blase { font-size: 1.1rem; } .wege { grid-template-columns: 1fr; } .weg { flex-direction: row; justify-content: flex-start; padding: 12px 18px; text-align: left; } .weg .emoji { font-size: 2.4rem; } }

  /* Buchstaben-Tafel */
  .tafel { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
  @media (max-width: 760px) { .tafel { grid-template-columns: repeat(4, 1fr); } }
  .bst { background: #fff; border: 0; border-radius: 18px; padding: 8px 4px 6px; font: inherit; cursor: pointer; color: inherit; display: flex; flex-direction: column; align-items: center; box-shadow: 0 5px 0 rgba(58,160,224,.2); }
  .bst b { font-size: 1.9rem; line-height: 1.1; }
  .bst span { font-size: 1.8rem; }
  .bst.selten { background: #F3F7FA; }
  .bst.laut { background: #FFF6DA; }
  .bst.kann b { color: #2E9C5A; }
  .detail { background: #fff; border-radius: 28px; padding: 18px; text-align: center; margin-top: 16px; box-shadow: 0 7px 0 rgba(58,160,224,.22); }
  .detail .gross { font-size: 4.2rem; font-weight: 700; line-height: 1; }
  .detail .bilder { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
  .detail .bilder button { border: 0; background: #F2F8FD; border-radius: 18px; padding: 8px 12px; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
  .detail .bilder button span { font-size: 3rem; }
  .detail .tipp { color: #4a6f8a; margin-top: 8px; }

  /* Übungen */
  .frage { text-align: center; font-size: 1.3rem; margin-bottom: 14px; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }
  .vorlage { font-size: 4.5rem; line-height: 1; }
  .vorlage.buchstabe { font-size: 4rem; font-weight: 700; background: #fff; border-radius: 22px; padding: 6px 20px; }
  .wahl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 720px; margin: 0 auto; }
  .wahl button { background: #fff; border: 4px solid transparent; border-radius: 26px; font-size: 4.6rem; padding: 14px 0; cursor: pointer; box-shadow: 0 7px 0 rgba(58,160,224,.22); color: inherit; font-family: inherit; }
  .wahl.buchstaben button { font-size: 3.6rem; font-weight: 700; }
  .wahl button.richtig { border-color: #2E9C5A; background: #E3F7EF; }
  .wahl button.falsch { border-color: #D7263D; opacity: .45; }
  .rueck { text-align: center; min-height: 2.2em; font-size: 1.4rem; font-weight: 700; margin-top: 12px; }
  .runde-ende { text-align: center; font-size: 1.4rem; }
  .runde-ende .gross { font-size: 4rem; }
  /* Silben: abwechselnd blau und rot mit Silbenbogen (Silbenmethode); ohne Farben nur die Bögen */
  .sw { white-space: nowrap; }
  .sb { display: inline-block; padding: 0 .04em .12em; margin: 0 .02em; border-bottom: .12em solid currentColor; border-radius: 0 0 .7em .7em / 0 0 .5em .5em; }
  .farbig .sb:nth-child(odd) { color: #2F6FD6; } .farbig .sb:nth-child(even) { color: #D7263D; }
  .silbenwort { font-size: 3.4rem; font-weight: 700; letter-spacing: .02em; text-align: center; margin: 4px 0 14px; }
  .texte { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (max-width: 640px) { .texte { grid-template-columns: 1fr; } }
  .text-karte { background: #fff; border: 0; border-radius: 22px; padding: 12px 16px; font: inherit; font-weight: 600; font-size: 1.15rem; display: flex; align-items: center; gap: 12px; cursor: pointer; color: inherit; text-align: left; box-shadow: 0 6px 0 rgba(58,160,224,.2); }
  .text-karte .emoji { font-size: 2.4rem; }
  .text-karte small { display: block; font-weight: 400; color: #4a6f8a; }
  .text-karte .fertig { margin-left: auto; font-size: 1.5rem; }
  .stufe-titel { grid-column: 1 / -1; margin: 10px 0 0; font-size: 1.2rem; }
  .lesetext { background: #fff; border-radius: 26px; padding: 18px 20px; display: flex; gap: 18px; align-items: center; box-shadow: 0 7px 0 rgba(58,160,224,.22); margin-bottom: 16px; }
  .lt-bild { font-size: 5rem; flex: none; }
  .lt-text { font-size: 1.7rem; line-height: 1.8; margin: 0; }
  @media (max-width: 640px) { .lesetext { flex-direction: column; } .lt-bild { font-size: 3.6rem; } .lt-text { font-size: 1.4rem; } }
  .wahl.antworten button { font-size: 1.25rem; font-weight: 600; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .wahl.antworten button span { font-size: 2.6rem; }
  @media (max-width: 640px) { .wahl.antworten { grid-template-columns: 1fr; } .wahl.antworten button { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 8px 14px; text-align: left; } }
  /* Nachspuren */
  .spuren-main { display: flex; gap: 20px; align-items: center; justify-content: center; }
  .spuren-seite { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 160px; }
  .spuren-bild { font-size: 5rem; }
  #spuren-wort { font-size: 1.4rem; font-weight: 600; margin: 0; text-align: center; }
  .spuren { width: min(62vh, 78vw); height: auto; background: #fff; border-radius: 28px; box-shadow: 0 7px 0 rgba(58,160,224,.22); touch-action: none; user-select: none; -webkit-user-select: none; }
  .spuren.breit { width: min(94vw, 980px, 150vh); }
  .spuren-main.breit-main { flex-direction: column-reverse; gap: 10px; }
  .spuren-main.breit-main .spuren-seite { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .spuren-main.breit-main .spuren-bild { font-size: 2.6rem; }
  .weg[hidden] { display: none; }
  @media (max-width: 640px) { .spuren-main { flex-direction: column-reverse; } .spuren-seite { flex-direction: row; flex-wrap: wrap; justify-content: center; } .spuren-bild { font-size: 3rem; } .spuren { width: 92vw; } }
  /* Wörter legen */
  .faecher { display: flex; justify-content: center; gap: 8px; margin: 10px 0 18px; flex-wrap: wrap; }
  .fach { width: 58px; height: 68px; border-radius: 14px; background: #fff; border: 3px dashed #9CC9EA; display: grid; place-items: center; font-size: 2.4rem; font-weight: 700; }
  .fach.voll { border-style: solid; border-color: #2E9C5A; background: #E3F7EF; }
  .steine { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; max-width: 640px; margin: 0 auto; }
  .stein { width: 64px; height: 64px; border: 0; border-radius: 16px; background: #fff; font: inherit; font-size: 2.2rem; font-weight: 700; color: inherit; cursor: pointer; box-shadow: 0 6px 0 rgba(58,160,224,.25); }
  .stein.weg { visibility: hidden; }
  .stein.wackel { animation: wackel .35s; background: #FFE1DD; }
  @keyframes wackel { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (max-width: 640px) { .fach { width: 44px; height: 54px; font-size: 1.9rem; } .stein { width: 54px; height: 54px; font-size: 1.9rem; } }
</style>
</head>
<body>

<section class="ansicht" id="start-ansicht">
  <div class="oben"><a class="knopf rund" href="../deutsch/?karte=1" aria-label="Zurück zu Fipsi">⬅️</a><h1>🔤 Lesen und Schreiben</h1></div>
  <main>
    <div class="erzaehler"><div id="fipsi-start"></div><div class="blase" id="start-blase"></div><button class="ton" id="start-ton" aria-label="Vorlesen">🔊</button></div>
    <div class="wege">
      <button class="weg" id="weg-tafel"><span class="emoji">🔤</span>Buchstaben-Tafel<small>Ansehen und anhören</small></button>
      <button class="weg" id="weg-gleich"><span class="emoji">👂</span>Gleicher Anfang<small>Was klingt am Anfang gleich?</small></button>
      <button class="weg" id="weg-bild"><span class="emoji">🖼️</span>Finde das Bild<small>Was fängt mit dem Buchstaben an?</small></button>
      <button class="weg" id="weg-buchstabe"><span class="emoji">🅰️</span>Welcher Buchstabe?<small>Hör den Anfang und wähle</small></button>
      <button class="weg" id="weg-silben"><span class="emoji">🌈</span>Silben lesen<small>Lies das Wort und finde das Bild</small></button>
      <button class="weg" id="weg-texte"><span class="emoji">📖</span>Lesetexte<small>Kurze Geschichten mit Fragen</small></button>
      <button class="weg" id="weg-spuren"><span class="emoji">✍️</span>Buchstaben nachspuren<small>Mit dem Finger schreiben</small></button>
      <button class="weg" id="weg-sas"><span class="emoji">✒️</span>Schreibschrift<small>Schulausgangsschrift: Buchstaben und Wörter</small></button>
      <button class="weg" id="weg-legen"><span class="emoji">🧩</span>Wörter legen<small>Hör das Wort und lege es</small></button>
    </div>
    <p class="stand" id="stand"></p>
  </main>
</section>

<section class="ansicht" id="tafel-ansicht" hidden>
  <div class="oben"><button class="knopf rund zurueck" aria-label="Zurück">⬅️</button><h1>🔤 Buchstaben-Tafel</h1></div>
  <main><div class="tafel" id="tafel"></div><div class="detail" id="detail" hidden></div></main>
</section>

<section class="ansicht" id="texte-ansicht" hidden>
  <div class="oben"><button class="knopf rund zurueck" aria-label="Zurück">⬅️</button><h1>📖 Lesetexte</h1>
    <button class="knopf" id="silbenfarbe" aria-pressed="true">🌈 Silben an</button></div>
  <main><div class="texte" id="texte"></div></main>
</section>

<section class="ansicht" id="text-ansicht" hidden>
  <div class="oben"><button class="knopf rund" id="text-zurueck" aria-label="Zur Liste">⬅️</button><h1 id="text-titel"></h1>
    <button class="ton" id="text-ton" aria-label="Vorlesen">🔊</button></div>
  <main>
    <div class="lesetext"><div class="lt-bild" id="text-bild" aria-hidden="true"></div><p class="lt-text" id="text-text"></p></div>
    <div class="frage" id="text-frage"></div>
    <div class="wahl antworten" id="text-wahl"></div>
    <p class="rueck" id="text-rueck" aria-live="polite"></p>
    <div id="text-ende" hidden class="runde-ende"></div>
  </main>
</section>

<section class="ansicht" id="spuren-ansicht" hidden>
  <div class="oben"><button class="knopf rund zurueck" aria-label="Zurück">⬅️</button><h1 id="spuren-titel">✍️ Nachspuren</h1><div class="fortschritt" aria-hidden="true"><span id="spuren-balken"></span></div></div>
  <main class="spuren-main">
    <div class="spuren-seite"><div class="spuren-bild" id="spuren-bild" aria-hidden="true"></div><p id="spuren-wort"></p>
      <button class="knopf" id="spuren-nochmal">🔁 Nochmal</button><button class="knopf" id="spuren-weiter">⏭️ Weiter</button></div>
    <svg id="spuren" class="spuren" viewBox="0 -10 100 130" role="img" aria-label="Buchstabe zum Nachspuren"></svg>
  </main>
  <p class="rueck" id="spuren-rueck" aria-live="polite"></p>
  <div id="spuren-ende" hidden class="runde-ende"></div>
</section>

<section class="ansicht" id="legen-ansicht" hidden>
  <div class="oben"><button class="knopf rund zurueck" aria-label="Zurück">⬅️</button><h1>🧩 Wörter legen</h1><div class="fortschritt" aria-hidden="true"><span id="legen-balken"></span></div></div>
  <main>
    <div class="frage"><button class="ton" id="legen-ton" aria-label="Wort hören">🔊</button><span class="vorlage" id="legen-bild" aria-hidden="true"></span></div>
    <div class="faecher" id="legen-faecher"></div>
    <div class="steine" id="legen-steine"></div>
    <p class="rueck" id="legen-rueck" aria-live="polite"></p>
    <div id="legen-ende" hidden class="runde-ende"></div>
  </main>
</section>

<section class="ansicht" id="uebung-ansicht" hidden>
  <div class="oben"><button class="knopf rund zurueck" aria-label="Zurück">⬅️</button><h1 id="uebung-titel"></h1><div class="fortschritt" aria-hidden="true"><span id="uebung-balken"></span></div></div>
  <main>
    <div class="frage" id="frage"></div>
    <div class="wahl" id="wahl"></div>
    <p class="rueck" id="rueck" aria-live="polite"></p>
    <div id="uebung-ende" hidden class="runde-ende"></div>
  </main>
</section>

<script src="../../shared/config.js"></script>
<script src="../../shared/core.js" data-root="../../"></script>
<script src="../../shared/ereignisse.js"></script>
<script src="../../shared/charakter.js"></script>
<script src="../../shared/lernfunde.js"></script>
<script src="../../shared/lernkartei.js"></script>
<script src="../../shared/sticker.js"></script>
<script src="../../shared/echtewelt.js"></script>
<script src="../../shared/zeit.js" data-art="lernen"></script>
<script src="../../shared/sprache.js"></script>
<script src="../../shared/figuren.js"></script>
<script src="../../inhalte/woerter/bestand.js"></script>
<script src="../../inhalte/woerter/d0.js"></script>
<script src="../../inhalte/woerter/anlaute.js"></script>
<script src="../../shared/woerter.js"></script>
<script src="../../inhalte/deutsch/anlaute.js"></script>
<script src="../../inhalte/deutsch/lesetexte.js"></script>
<script src="../../inhalte/deutsch/schreiben.js"></script>
<script src="../../inhalte/deutsch/schreibschrift.js"></script>
<script src="../../shared/koennen.js"></script>
<script src="lesen.js"></script>
</body>
</html>
