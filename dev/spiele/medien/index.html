<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tablet-Führerschein</title>
<meta name="theme-color" content="#E1F3FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  body { background: #E8F0FF; background-image: none; --grund: #E8F0FF; --akzent: var(--pflaume-hell); }
  .ansicht[hidden] { display: none !important; }
  .oben { display: flex; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .oben h1 { margin: 0; font-size: 1.7rem; flex: 1; min-width: 0; }
  .rund { width: 56px; padding: 0; font-size: 1.6rem; flex: none; text-decoration: none; }
  .sterne b { font-size: 1.4rem; }

  /* Übersicht */
  #liste-ansicht { min-height: 100dvh; padding-bottom: 30px; }
  .intro { display: flex; align-items: center; gap: 14px; max-width: 900px; margin: 10px auto 0; padding: 0 16px; }
  .intro svg { width: 100px; flex: none; }
  .intro p { margin: 0; background: #fff; border-radius: 20px; padding: 14px 18px; font-size: 1.25rem; font-weight: 500; line-height: 1.35; }
  .lektionen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 900px; margin: 18px auto 0; padding: 0 16px; }
  .lek {
    position: relative; text-align: left; background: #fff; border-radius: 24px; padding: 16px 18px 14px;
    display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center;
    box-shadow: 0 7px 0 rgba(75,35,128,.12); font-weight: 600; font-size: 1.15rem; line-height: 1.2;
  }
  .lek:active { transform: translateY(3px); }
  .lek .emoji { grid-row: span 2; font-size: 2.8rem; width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: var(--f); }
  .lek .stern-reihe { font-size: .95rem; letter-spacing: 1px; min-height: 1.2em; }
  .lek .stern-reihe .leer { filter: grayscale(1); opacity: .3; }
  .lek.zu { background: #EEF0F5; color: #8C8FA3; box-shadow: none; }
  .lek.zu .emoji { filter: grayscale(1); opacity: .5; }
  .lek.jetzt { box-shadow: 0 0 0 5px var(--pflaume-hell), 0 7px 0 rgba(75,35,128,.18); }
  @media (max-width: 760px) { .lektionen { grid-template-columns: 1fr 1fr; } }
  .fs-knopf { display: block; margin: 22px auto 0; min-height: 66px; font-size: 1.35rem; }

  /* Lektion */
  #lektion-ansicht { height: 100dvh; display: flex; flex-direction: column; background: var(--grund); }
  .fortschritt { flex: 0 0 120px; height: 16px; border-radius: 999px; background: #fff; overflow: hidden; }
  .fortschritt span { display: block; height: 100%; background: var(--akzent); border-radius: 999px; transition: width .3s; }
  .buehne { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(240px, 34%) 1fr; gap: 18px; padding: 14px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .erzaehler { display: flex; flex-direction: column; gap: 10px; justify-content: flex-end; min-height: 0; }
  .blase { position: relative; background: #fff; border-radius: 26px; padding: 18px 20px; font-size: 1.4rem; font-weight: 500; line-height: 1.38; box-shadow: 0 6px 0 rgba(0,0,0,.08); overflow: auto; max-height: 60dvh; }
  .blase::after { content: ""; position: absolute; bottom: -16px; left: 44px; border: 10px solid transparent; border-top: 14px solid #fff; border-bottom: 0; }
  .klein-knopf { min-height: 48px; padding: 0 16px; border-radius: 999px; background: var(--himmel); font-weight: 600; font-size: 1.1rem; margin-top: 10px; }
  .robo { width: min(180px, 58%); align-self: center; }
  .robo.spricht { animation: sprechen .5s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes sprechen { to { transform: translateY(-4px) rotate(-1.5deg); } }
  .aufgabe { position: relative; background: #fff; border-radius: 30px; padding: 22px; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; box-shadow: 0 10px 0 rgba(0,0,0,.07); text-align: center; }
  .gross-emoji { font-size: clamp(4rem, 11vw, 7rem); line-height: 1.05; }
  .optionen { display: grid; gap: 12px; width: 100%; max-width: 560px; }
  .option { border-radius: 22px; background: var(--grund); min-height: 68px; padding: 12px 18px; font-size: 1.3rem; font-weight: 600; color: var(--pflaume); box-shadow: 0 6px 0 rgba(0,0,0,.1); line-height: 1.25; }
  .option:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.1); }
  .option.richtig { background: #CFF3E4; box-shadow: 0 0 0 5px var(--minze); }
  .option.falsch { background: #FFE1DD; opacity: .6; }
  .warum { max-width: 560px; border-radius: 20px; padding: 14px 18px; font-size: 1.25rem; font-weight: 500; line-height: 1.4; }
  .warum.gut { background: #E3F7EF; box-shadow: inset 0 0 0 3px var(--minze); }
  .warum.nein { background: #FFEDEA; box-shadow: inset 0 0 0 3px #FFB4A8; }
  .warum[hidden] { display: none; }
  .weiter { min-height: 72px; font-size: 1.5rem; padding: 0 44px; background: var(--pflaume); color: #fff; }
  .daumen { display: flex; gap: 20px; }
  .daumen .option { font-size: 3.4rem; width: 130px; height: 120px; }
  .satz-gross { font-size: 1.6rem; font-weight: 600; max-width: 28ch; line-height: 1.35; }

  /* Vorlese- und Russisch-Knöpfe */
  .option-zeile { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .mini-knoepfe { display: inline-flex; gap: 6px; vertical-align: middle; margin-left: 8px; }
  .option-zeile .mini-knoepfe { margin-left: 0; }
  .mk { min-width: 46px; height: 46px; border-radius: 999px; background: #fff; font-size: 1.1rem; font-weight: 700; color: var(--pflaume); box-shadow: inset 0 0 0 3px #D9D2EC; }
  .mk.ru { font-size: .95rem; }
  .mk.an { background: #FFE08A; box-shadow: none; }
  .ru-text { display: block; margin-top: 6px; font-size: .88em; font-weight: 500; color: #7A4A10; background: #FFF6D6; border-radius: 12px; padding: 6px 10px; }
  .ru-text[hidden] { display: none; }
  .ru-schalter { font-size: 1.1rem; font-weight: 700; }
  .ru-schalter.aus { opacity: .45; text-decoration: line-through; }
  .warum .mini-knoepfe, .satz-gross .mini-knoepfe, .nachricht .mini-knoepfe, .sortier-karte .mini-knoepfe { margin-top: 6px; }
  .sortier-karte .mini-knoepfe { margin-left: 0; }

  /* Übungen */
  .feld { position: relative; width: 100%; flex: 1; min-height: 300px; border-radius: 22px; background: var(--grund); overflow: hidden; touch-action: none; }
  .ziel-stern { position: absolute; width: 92px; height: 92px; font-size: 4rem; display: grid; place-items: center; transform: translate(-50%, -50%); transition: left .25s, top .25s; }
  .zaehler { font-size: 1.4rem; font-weight: 700; }
  .karussell { display: flex; height: 100%; transition: transform .35s ease; }
  .karussell div { flex: 0 0 100%; display: grid; place-items: center; font-size: 8rem; }
  .punkte { display: flex; gap: 8px; justify-content: center; }
  .punkte span { width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 3px var(--akzent); }
  .punkte span.an { background: var(--akzent); }
  .apfel { position: absolute; left: 16%; top: 40%; font-size: 4.6rem; touch-action: none; cursor: grab; transform: translate(-50%, -50%); user-select: none; }
  .korb { position: absolute; right: 8%; bottom: 8%; width: 170px; height: 130px; display: grid; place-items: center; font-size: 6rem; border-radius: 24px; border: 5px dashed var(--akzent); }
  .korb.voll { background: #CFF3E4; border-style: solid; border-color: var(--minze); }
  .halten { position: relative; width: 190px; height: 190px; border-radius: 50%; font-size: 1.5rem; font-weight: 700; color: var(--pflaume);
    background: conic-gradient(var(--minze) calc(var(--p, 0) * 1%), #fff 0); box-shadow: 0 8px 0 rgba(0,0,0,.12); touch-action: none; }
  .halten span { position: absolute; inset: 16px; border-radius: 50%; background: var(--grund); display: grid; place-items: center; }
  .zoom-bild { position: absolute; left: 50%; top: 50%; font-size: 4rem; transform: translate(-50%, -50%) scale(var(--s, 1)); }
  .ueberspringen { min-height: 48px; font-size: 1.05rem; }

  /* Werbefenster-Übung */
  .spielchen { position: relative; width: 100%; max-width: 520px; height: 340px; border-radius: 22px; background: linear-gradient(#BFE6FF, #8FD66B); overflow: hidden; }
  .spielchen .frosch { position: absolute; left: 20%; bottom: 20px; font-size: 3.4rem; animation: hops 1s ease-in-out infinite alternate; }
  @keyframes hops { to { transform: translateY(-60px); } }
  .werbung { position: absolute; inset: 34px 28px; background: #fff; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; }
  .werbung .label { position: absolute; top: 8px; left: 12px; font-size: .85rem; font-weight: 600; color: #888; }
  .werbung .schliessen { position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border-radius: 50%; font-size: 1.2rem; color: #777; }
  .werbung .gross { font-size: 2.6rem; }
  .werbung .gratis { min-height: 64px; padding: 0 26px; border-radius: 999px; background: #FF3D7F; color: #fff; font-size: 1.5rem; font-weight: 700; box-shadow: 0 6px 0 #B0205A; }

  /* Chat-Übung */
  .chat { width: 100%; max-width: 480px; border-radius: 22px; background: #ECE5DD; overflow: hidden; text-align: left; box-shadow: inset 0 0 0 3px #D8CFC4; }
  .chat .kopf { background: #4B2380; color: #fff; padding: 12px 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .chat .kopf span { width: 36px; height: 36px; border-radius: 50%; background: #C9B8F0; display: grid; place-items: center; }
  .chat .nachricht { margin: 16px; background: #fff; border-radius: 4px 18px 18px 18px; padding: 12px 16px; font-size: 1.3rem; max-width: 85%; box-shadow: 0 2px 0 rgba(0,0,0,.08); }

  /* Sortieren */
  .sortier-karte { background: var(--grund); border-radius: 26px; padding: 20px 30px; font-size: 1.6rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 260px; }
  .sortier-karte .e { font-size: 4.4rem; }
  .sortier-knoepfe { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 560px; }
  .sortier-knoepfe .option { font-size: 1.35rem; min-height: 84px; }

  @media (orientation: portrait) {
    .buehne { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .erzaehler { flex-direction: row; align-items: flex-end; }
    .erzaehler .robo { width: 100px; flex: none; order: -1; }
    .blase { flex: 1; max-height: 30dvh; }
    .blase::after { left: -14px; bottom: 26px; border: 10px solid transparent; border-right: 14px solid #fff; border-left: 0; }
  }

  /* Ende und Führerschein */
  .mitte { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
  .ende-karte { background: #fff; border-radius: 32px; padding: 30px; width: min(580px, 100%); text-align: center; box-shadow: 0 12px 0 rgba(0,0,0,.08); }
  .ende-karte h2 { margin: 0 0 6px; font-size: 2.3rem; }
  .ende-karte p { margin: 0 0 8px; font-size: 1.3rem; }
  .gross-sterne { display: flex; justify-content: center; gap: 10px; margin: 10px 0; font-size: 3.8rem; }
  .gross-sterne span { display: inline-block; transform: scale(0); animation: plopp .45s cubic-bezier(.3,1.7,.5,1) forwards; }
  .gross-sterne span.leer { filter: grayscale(1); opacity: .25; }
  @keyframes plopp { to { transform: scale(1); } }
  .gewinn { display: inline-block; background: #FFF6D6; padding: 8px 18px; border-radius: 999px; font-weight: 600; font-size: 1.2rem; margin: 6px 0 16px; }
  .ende-knoepfe { display: grid; gap: 12px; }
  .ende-knoepfe .knopf { min-height: 62px; font-size: 1.3rem; }
  #fs-ansicht > div { width: min(760px, 100%); }
  #urkunde svg { width: min(720px, 100%); height: auto; display: block; margin: 0 auto 16px; border-radius: 18px; box-shadow: 0 12px 0 rgba(0,0,0,.1); }
  .fs-knoepfe { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>

<section class="ansicht" id="liste-ansicht">
  <div class="oben">
    <a class="knopf rund" href="../../" aria-label="Zur Spielwelt">🏠</a>
    <h1>Tablet-Führerschein</h1>
    <button class="knopf rund ru-schalter" id="ru-schalter" aria-label="Hilfe in der Muttersprache an oder aus">RU</button>
    <button class="knopf rund" id="ton-vorlesen" aria-label="Vorlesen an oder aus">🗣️</button>
    <div class="knopf sterne">⭐ <b id="sterne">0</b></div>
  </div>
  <div class="intro"><span id="robo-klein"></span><p id="intro-text"></p></div>
  <div class="lektionen" id="lektionen"></div>
  <p style="text-align:center;margin:16px" id="robo-zeile"><a class="knopf haupt" id="robo-link" href="../robo/">🤖 Robo programmieren</a></p>
  <script>/* Robo-Programmieren ab Klasse 3 (NA-60) */ addEventListener("DOMContentLoaded", function () { const S = window.Spielwelt, st = S && S.stufe && (S.stufe() || {}).code; if (st && !["3", "4", "5"].includes(st)) { const z = document.getElementById("robo-zeile"); if (z) z.hidden = true; } });</script>
  <button class="knopf haupt fs-knopf" id="fs-zeigen" hidden>🪪 Meinen Führerschein ansehen</button>
</section>

<section class="ansicht" id="lektion-ansicht" hidden>
  <div class="oben">
    <button class="knopf rund" id="zur-liste" aria-label="Zur Übersicht">⬅️</button>
    <h1 id="lektion-name"></h1>
    <div class="fortschritt" aria-hidden="true"><span id="balken"></span></div>
  </div>
  <div class="buehne">
    <div class="erzaehler">
      <div class="blase" id="blase" aria-live="polite"></div>
      <div id="robo-gross"></div>
    </div>
    <div class="aufgabe" id="aufgabe"></div>
  </div>
</section>

<section class="ansicht mitte" id="ende-ansicht" hidden>
  <div class="ende-karte">
    <h2 id="ende-titel"></h2>
    <div class="gross-sterne" id="ende-sterne" aria-hidden="true"></div>
    <p id="ende-text"></p>
    <div class="gewinn" id="ende-gewinn"></div>
    <div class="ende-knoepfe" id="ende-knoepfe"></div>
  </div>
</section>

<section class="ansicht mitte" id="fs-ansicht" hidden>
  <div>
    <div id="urkunde"></div>
    <div class="fs-knoepfe">
      <button class="knopf" id="fs-bild">⬇️ Als Bild speichern</button>
      <button class="knopf haupt" id="fs-zurueck">Zur Übersicht</button>
    </div>
  </div>
</section>

<script src="../../shared/config.js"></script>
<script src="../../shared/core.js" data-root="../../"></script>
<script src="../../shared/ereignisse.js"></script>
<script src="../../shared/charakter.js"></script>
<script src="../../shared/lernfunde.js"></script>
<script src="../../shared/sticker.js"></script>
<script src="../../shared/echtewelt.js"></script>
<script src="../../shared/zeit.js" data-art="lernen"></script>
<script src="../../shared/sprache.js"></script>
<script src="lektionen.js"></script>
<script src="medien.js"></script>
</body>
</html>
