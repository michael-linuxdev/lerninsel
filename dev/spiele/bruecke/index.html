<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bennos Brücke</title>
<meta name="theme-color" content="#6EC3E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  /* Bennos Brücke (07.11.2026, Kapitel 9): Bauplatz am Ufer – Himmel und Wasser, Holz, Stil A (Kontur #3B1F63, feste Schatten) */
  html, body { min-height: 100%; }
  body { background: linear-gradient(180deg, #A8DDF5 0, #CFEFFB 55%, #F6E7C1 100%); background-attachment: fixed; }
  .oben { display: flex; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .oben h1 { margin: 0; font-size: 1.8rem; flex: 1; min-width: 0; color: #3B1F63; }
  @media (max-width: 480px) { .oben h1 { font-size: 1.3rem; } }
  .rund { width: 56px; padding: 0; font-size: 1.6rem; flex: none; text-decoration: none; }
  .mitte { max-width: 1040px; margin: 0 auto; padding: 10px 16px 30px; display: grid; gap: 12px; }
  .benno { display: flex; gap: 12px; align-items: center; }
  .benno .figur { font-size: 3.4rem; flex: none; }
  .benno .blase { background: #fff; border-radius: 24px; padding: 10px 16px; font-size: 1.2rem; font-weight: 500; box-shadow: 0 6px 0 #3B1F63; flex: 1; display: flex; gap: 10px; align-items: center; position: relative; }
  .benno .blase::after { content: ""; position: absolute; left: -12px; top: 50%; width: 18px; height: 18px; margin-top: -9px; background: #fff; border: solid var(--kontur, #3B1F63); border-width: 0 0 3px 3px; transform: rotate(45deg); }
  .blase p { margin: 0; flex: 1; line-height: 1.35; }
  .ru { display: block; font-size: 1rem; font-weight: 500; color: var(--pflaume-hell); margin-top: 4px; }
  .vorlesen { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--himmel); font-size: 1.5rem; }
  .bauplan { width: 100%; height: auto; display: block; border-radius: 22px; border: 4px solid #3B1F63; box-shadow: 0 6px 0 #3B1F63; background: #BFE6F7; }
  .bauplan .im-bau { animation: wachse .5s ease-out; }
  @keyframes wachse { from { opacity: .3; } to { opacity: 1; } }
  .karte { background: #FFF8E6; border-radius: 28px; padding: 14px 16px; border: 4px solid #3B1F63; box-shadow: 0 6px 0 #3B1F63; display: grid; gap: 10px; text-align: center; }
  .karte.hell { background: #FFF3B0; }
  .karte h2 { margin: 0; }
  .stand { margin: 0; font-weight: 700; color: var(--pflaume-hell); }
  .klein { margin: 0; font-size: 1rem; color: var(--pflaume-hell); }
  .frage-zeile { display: flex; gap: 10px; align-items: center; justify-content: center; }
  .frage-zeile p { margin: 0; font-size: 1.3rem; font-weight: 600; line-height: 1.35; }
  .hinweis { min-height: 1.6em; font-size: 1.15rem; font-weight: 600; margin: 0; color: #B4532A; }
  .hinweis.gut { color: #2E9C5A; }
  .hinweis.loesung { color: #3B1F63; }
  .knoepfe { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .knoepfe a { text-decoration: none; }
  .werkstueck:empty { display: none; }
  /* Bretter */
  .bretter-wahl { display: flex; flex-direction: column; gap: 10px; align-items: stretch; max-width: 560px; margin: 0 auto; width: 100%; }
  .brett-knopf { background: #fff; border: 4px solid #3B1F63; border-radius: 18px; box-shadow: 0 5px 0 #3B1F63; padding: 6px 10px; min-height: 60px; display: flex; align-items: center; }
  .brett-knopf svg { height: 44px; }
  .gelegt { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; max-width: 560px; margin: 0 auto; width: 100%; min-height: 50px; background: #E6F4FB; border-radius: 16px; padding: 8px; }
  .gelegt-brett { width: 100%; display: flex; } .gelegt-brett svg { height: 34px; }
  .markiert { animation: blink .7s infinite alternate; outline: 4px solid #FF8A3D; }
  @keyframes blink { to { background: #FFE38A; } }
  .brett-mess { max-width: 560px; margin: 0 auto; width: 100%; }
  .brett-lang svg { height: 50px; width: 100%; }
  .pfoten { font-size: 2.2rem; letter-spacing: 6px; text-align: left; padding-left: 8px; }
  /* Lücke mit Maßband */
  .luecke { position: relative; max-width: 620px; width: 100%; margin: 0 auto 22px; }
  .luecke-innen { display: flex; height: 54px; border: 4px dashed #3B1F63; border-radius: 12px; background: #9ED8F0; overflow: hidden; }
  .stk { display: grid; place-items: center; font-weight: 700; border-right: 3px solid #3B1F63; }
  .massband { position: absolute; left: 0; right: 0; bottom: -22px; height: 20px; }
  .massband i { position: absolute; top: 0; transform: translateX(-50%); font-style: normal; font-size: .85rem; font-weight: 700; border-left: 2px solid #3B1F63; padding-left: 2px; height: 20px; }
  .stuecke { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .stk-knopf { min-height: 56px; border-radius: 14px; border: 4px solid #3B1F63; box-shadow: 0 5px 0 #3B1F63; font-size: 1.2rem; font-weight: 700; padding: 0 12px; }
  /* Felder, Plan, Meter */
  .feldleiste, .planraster { display: flex; max-width: 620px; width: 100%; margin: 0 auto; }
  .feldleiste .feld { flex: 1; height: 50px; display: grid; place-items: center; background: #D2A066; border: 3px solid #3B1F63; font-weight: 700; font-size: 1.1rem; }
  .feldleiste .feld.an { background: #FFD84D; }
  .planraster { background: #fff; border: 3px solid #3B1F63; border-radius: 10px; overflow: hidden; background-image: linear-gradient(#cfe0f0 1px, transparent 1px); background-size: 100% 12px; }
  .planraster .zelle { flex: 1; min-width: 0; height: 52px; border-right: 2px dashed #7B9BFF; display: grid; place-items: center; font-weight: 700; font-size: .9rem; background: transparent; border-radius: 0; padding: 0; }
  .planraster .zelle.voll { background: #7B9BFF; color: #fff; }
  .planraster.tippbar .zelle { min-height: 56px; font-size: 1.1rem; }
  .pfeilerbild { width: 100%; max-width: 680px; margin: 0 auto; display: block; }
  .meter { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .meter-knopf { min-width: 64px; min-height: 52px; border-radius: 14px; background: #fff; border: 3px solid #3B1F63; box-shadow: 0 4px 0 #3B1F63; font-weight: 700; font-size: 1.1rem; }
  .meter-knopf.an { background: #7A5230; color: #fff; }
  .wahl { display: grid; gap: 10px; max-width: 560px; margin: 0 auto; width: 100%; }
  .wahl-knopf { min-height: 60px; font-size: 1.2rem; }
  .wahl-knopf small { display: block; }
  /* Zahlentasten */
  .eingabe { display: grid; gap: 8px; justify-items: center; }
  .anzeige { min-width: 200px; padding: 8px 18px; background: #fff; border: 4px solid #3B1F63; border-radius: 16px; font-size: 1.8rem; font-weight: 700; }
  .tasten { display: grid; grid-template-columns: repeat(4, 72px); gap: 8px; }
  .tasten button { height: 60px; border-radius: 18px; background: #fff; font-size: 1.7rem; font-weight: 700; border: 3px solid #3B1F63; box-shadow: 0 4px 0 #3B1F63; }
  .tasten button.ok { background: var(--wiese, #2E9C5A); color: #fff; }
  .zu-oder { text-align: center; }
  @media (orientation: landscape) and (min-width: 900px) and (max-height: 900px) { .karte { padding: 10px 14px; gap: 8px; } .bauplan { max-height: 150px; } .tasten button { height: 52px; } }
  @media (max-width: 480px) { .mitte { padding-left: 10px; padding-right: 10px; } .tasten { grid-template-columns: repeat(4, 64px); } .frage-zeile p { font-size: 1.15rem; } .benno .figur { font-size: 2.6rem; } }
</style>
</head>
<body>
<div class="oben">
  <a class="knopf rund" href="../welt3d/heimat.html" aria-label="Zurück zur Insel">⬅️</a>
  <h1>🌉 Bennos Brücke</h1>
  <div class="knopf sterne">⭐ <b id="sterne">0</b></div>
</div>
<main class="mitte">
  <section class="benno">
    <div class="figur" aria-hidden="true">&#xE104;</div>
    <div class="blase"><p id="benno-text"></p><button class="vorlesen" id="benno-vorlesen" aria-label="Vorlesen">🔊</button></div>
  </section>
  <div id="plan"></div>
  <div id="bereich"></div>
  <section class="zu-oder" id="zu" hidden>
    <div class="blase karte"><p>🔒 Bennos Brücke öffnet mit Kapitel 9. Benno sammelt noch Holz – wenn es soweit ist, holt er dich ab!</p></div>
  </section>
</main>

</body>
</html>
