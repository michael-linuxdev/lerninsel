<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Atelier</title>
<meta name="theme-color" content="#FFF3E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  body { background: #FFF3E0; background-image: none; }
  .oben { display: flex; align-items: center; gap: 12px; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .oben h1 { margin: 0; font-size: 1.7rem; flex: 1; }
  .rund { width: 56px; padding: 0; font-size: 1.6rem; flex: none; text-decoration: none; }
  .seite { max-width: 1100px; margin: 0 auto; padding: 14px 16px 40px; display: grid; gap: 16px; }
  .karte { background: #fff; border-radius: 28px; padding: 18px; box-shadow: 0 8px 0 rgba(194,51,122,.12); }
  .karte h2 { margin: 0 0 10px; font-size: 1.5rem; }
  .klein { font-size: 1rem; color: var(--pflaume-hell); margin: 0; }
  .paula-zeile { display: flex; gap: 14px; align-items: center; }
  .paula { width: 120px; height: 126px; flex: none; } .paula svg { width: 100%; height: 100%; }
  .paula-zeile p { margin: 0; font-size: 1.2rem; font-weight: 500; }
  .ru { background: #FFF6D6; border-radius: 12px; padding: 6px 10px; font-size: 1.05rem; margin-top: 6px !important; }
  .kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .kachel { border-radius: 26px; padding: 18px 14px; min-height: 150px; display: grid; justify-items: center; align-content: center; gap: 6px; font-size: 1.25rem; font-weight: 700; color: var(--pflaume); box-shadow: 0 6px 0 rgba(0,0,0,.1); text-align: center; }
  .kachel .e { font-size: 3.2rem; }
  .kachel small { font-weight: 500; font-size: .98rem; }
  .k1 { background: #FFE1EC; } .k2 { background: #DFF3FF; } .k3 { background: #FFF1C2; } .k4 { background: #E3F7EF; }
  .auftrag { background: #FFF1C2; border-radius: 18px; padding: 10px 14px; font-weight: 600; font-size: 1.15rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .auftrag[hidden] { display: none; }
  .auftrag span { flex: 1; min-width: 200px; }
  .ansicht[hidden] { display: none !important; }

  /* Malen */
  .mal { display: grid; grid-template-columns: 1fr 220px; gap: 12px; align-items: start; }
  .links { display: grid; gap: 10px; justify-items: center; }
  .leinwand-rahmen { background: #9A6A3F; padding: 10px; border-radius: 18px; box-shadow: 0 6px 0 rgba(0,0,0,.15); }
  #leinwand { display: block; width: 640px; height: 480px; background: #fff; border-radius: 8px; touch-action: none; }
  .aktionen { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .aktionen .knopf { min-height: 54px; margin: 0; }
  .werkzeug { background: #fff; border-radius: 22px; padding: 12px; display: grid; gap: 12px; box-shadow: 0 6px 0 rgba(0,0,0,.08); }
  .reihe { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .farbe { width: 38px; height: 38px; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(0,0,0,.15); padding: 0; }
  .farbe.an { box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--pflaume); }
  .wz { min-width: 54px; min-height: 54px; border-radius: 16px; background: #F6F3FB; font-size: 1.7rem; display: grid; place-items: center; padding: 0 6px; }
  .wz.an { background: #FFE1EC; box-shadow: inset 0 0 0 4px var(--beere); }
  .wz small { font-size: .7rem; font-weight: 700; color: var(--pflaume); }
  .groesse span { display: block; border-radius: 50%; background: var(--pflaume); }
  .stempel-wahl { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .stempel-wahl[hidden] { display: none; }
  .stempel-wahl button { font-size: 1.5rem; width: 44px; height: 44px; border-radius: 12px; background: #FFF7FA; padding: 0; }
  .stempel-wahl button.an { box-shadow: inset 0 0 0 3px var(--beere); }
  @media (max-width: 820px) { .mal { grid-template-columns: 1fr; } .werkzeug { grid-template-columns: 1fr 1fr; } .werkzeug > .voll { grid-column: 1 / -1; } }

  /* Vorlagen und Galerie */
  .vorlagen, .galerie { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .vorlagen button, .galerie button { background: #fff; border-radius: 20px; padding: 10px; display: grid; gap: 6px; font-weight: 700; font-size: 1.1rem; color: var(--pflaume); box-shadow: 0 6px 0 rgba(0,0,0,.08); position: relative; }
  .vorlagen canvas, .galerie img { width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; background: #fff; box-shadow: inset 0 0 0 2px #F0E6DA; object-fit: cover; }
  .galerie .an-wand { position: absolute; top: 14px; right: 14px; background: #fff; border-radius: 999px; padding: 2px 8px; font-size: 1.1rem; }
  .leer { text-align: center; font-size: 1.2rem; padding: 20px; }

  /* Dialog */
  .dlg { position: fixed; inset: 0; z-index: 40; background: rgba(75,35,128,.55); display: grid; place-items: center; padding: 16px; }
  .dlg[hidden] { display: none; }
  .dlg .karte { max-width: 620px; width: 100%; text-align: center; }
  .dlg img { width: 100%; border-radius: 14px; box-shadow: inset 0 0 0 2px #F0E6DA; }
  .dlg .knopf { margin: 6px; min-height: 58px; }
</style>
</head>
<body>
<div class="oben">
  <a class="knopf rund" href="../../" id="heim" aria-label="Zur Startseite">🏠</a>
  <h1>🎨 Atelier</h1>
</div>
<main class="seite">
  <section class="ansicht" id="start-ansicht">
    <div class="karte"><div class="paula-zeile"><div class="paula" aria-hidden="true"></div><div><p id="paula-text"></p><p class="ru" id="paula-ru" hidden></p></div></div></div>
    <div class="auftrag" id="tagesauftrag"><span id="tagesauftrag-text"></span><button class="knopf" id="auftrag-anderer">🔄 Andere Idee</button><button class="knopf haupt" id="auftrag-los">🖌️ Los geht's</button></div>
    <div class="kacheln">
      <button class="kachel k1" id="frei-malen"><span class="e">🖌️</span>Freies Malen<small>Eine leere Leinwand</small></button>
      <button class="kachel k2" data-zu="vorlagen"><span class="e">🖍️</span>Ausmalbilder<small>Mit dem Farbeimer füllen</small></button>
      <button class="kachel k4" data-zu="galerie"><span class="e">🖼️</span>Meine Galerie<small id="galerie-zahl">Deine Bilder</small></button>
    </div>
  </section>

  <section class="ansicht" id="malen-ansicht" hidden>
    <div class="auftrag" id="mal-auftrag" hidden><span id="mal-auftrag-text"></span></div>
    <div class="mal">
      <div class="links">
        <div class="leinwand-rahmen" id="rahmen"><canvas id="leinwand" width="1024" height="768" aria-label="Leinwand zum Malen"></canvas></div>
        <div class="aktionen">
          <button class="knopf" id="mal-zurueck">⬅️ Zurück</button>
          <button class="knopf" id="zurueck-schritt">↩️ Rückgängig</button>
          <button class="knopf" id="neu">🧽 Neu</button>
          <button class="knopf haupt" id="fertig">✅ Fertig – aufhängen</button>
        </div>
      </div>
      <div class="werkzeug">
        <div class="reihe voll" id="farben"></div>
        <div class="reihe voll" id="werkzeuge"></div>
        <div class="reihe" id="groessen"></div>
        <div class="stempel-wahl voll" id="stempel" hidden></div>
      </div>
    </div>
  </section>

  <section class="ansicht" id="vorlagen-ansicht" hidden>
    <div class="karte"><h2>🖍️ Ausmalbilder</h2><p class="klein">Tipp: Mit dem Farbeimer 🪣 füllst du eine ganze Fläche auf einmal.</p></div>
    <div class="vorlagen" id="vorlagen"></div>
    <button class="knopf" data-zu="start">⬅️ Zurück zu Paula</button>
  </section>

  <section class="ansicht" id="galerie-ansicht" hidden>
    <div class="karte"><h2>🖼️ Meine Galerie</h2><p class="klein" id="galerie-info"></p></div>
    <div class="galerie" id="galerie"></div>
    <button class="knopf" data-zu="start">⬅️ Zurück zu Paula</button>
  </section>
</main>

<div class="dlg" id="bild-dlg" hidden>
  <div class="karte">
    <img id="bild-gross" alt="Dein Bild">
    <p class="klein" id="bild-info"></p>
    <div>
      <button class="knopf" id="bild-weiter">🖌️ Weitermalen</button>
      <button class="knopf" id="bild-wand">🖼️ An die Wand</button>
      <button class="knopf" id="bild-loeschen">🗑️ Löschen</button>
      <button class="knopf haupt" id="bild-zu">Schließen</button>
    </div>
  </div>
</div>
<div class="dlg" id="frage-dlg" hidden>
  <div class="karte"><p id="frage-text" style="font-size:1.3rem;font-weight:600"></p><div id="frage-knoepfe"></div></div>
</div>

<script src="../../shared/config.js"></script>
<script src="../../shared/core.js" data-root="../../"></script>
<script src="../../shared/charakter.js"></script>
<script src="../../shared/lernfunde.js"></script>
<script src="../../shared/sticker.js"></script>
<script src="../../shared/echtewelt.js"></script>
<script src="../../shared/zeit.js" data-art="lernen"></script>
<script src="../../shared/sprache.js"></script>
<script src="../../shared/figuren.js"></script>
<script src="../../shared/bilder.js"></script>
<script src="vorlagen.js"></script>
<script src="atelier.js"></script>
</body>
</html>
