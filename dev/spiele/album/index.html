<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Stickeralbum</title>
<meta name="theme-color" content="#FFF1E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  body { background: #FFF1E0; background-image: none; }
  .oben { display: flex; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .oben h1 { margin: 0; font-size: 1.8rem; flex: 1; }
  .rund { width: 56px; padding: 0; font-size: 1.6rem; flex: none; text-decoration: none; }
  .zaehler { font-weight: 700; }
  .reiter { display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px 4px; max-width: 1100px; margin: 0 auto; scrollbar-width: none; }
  .reiter button { flex: none; font: inherit; font-weight: 600; font-size: 1.05rem; border: 0; border-radius: 999px; padding: 10px 16px; min-height: 52px; background: #fff; color: var(--pflaume); box-shadow: 0 4px 0 rgba(160,100,40,.12); position: relative; }
  .reiter button.an { background: var(--pflaume); color: #fff; }
  .reiter .punkt { position: absolute; top: 4px; right: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--beere, #E0457B); }
  .blatt { max-width: 1100px; margin: 12px auto 40px; padding: 0 16px; }
  .seite { border-radius: 30px; padding: 20px; box-shadow: 0 8px 0 rgba(160,100,40,.12); }
  .seite h2 { margin: 0 0 4px; font-size: 1.6rem; }
  .seite .klein { margin: 0 0 16px; font-weight: 600; color: var(--pflaume-hell); }
  .feld { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; max-width: 760px; margin: 0 auto; }
  @media (max-width: 520px) { .feld { grid-template-columns: repeat(2, 1fr); } }
  .st { aspect-ratio: 1; border-radius: 24px; border: 0; background: rgba(255,255,255,.75); font: inherit; color: var(--pflaume); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative; padding: 8px; box-shadow: inset 0 0 0 3px rgba(255,255,255,.9); }
  .st .e { font-size: 3.4rem; line-height: 1.1; }
  .st b { font-size: 1rem; text-align: center; line-height: 1.15; }
  .st.hat { background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.08); transform: rotate(-1.5deg); }
  .st.hat:nth-child(2n) { transform: rotate(1.5deg); }
  .st.fehlt { border: 3px dashed rgba(75,35,128,.25); background: rgba(255,255,255,.4); }
  .st.fehlt .e { filter: grayscale(1) brightness(.35); opacity: .25; }
  .st.fehlt b { opacity: .55; }
  .st .anz { position: absolute; top: 6px; right: 8px; background: var(--pflaume); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: .9rem; font-weight: 700; }
  .st .neu { position: absolute; top: -8px; left: -6px; background: var(--beere, #E0457B); color: #fff; border-radius: 999px; padding: 2px 10px; font-size: .85rem; font-weight: 700; transform: rotate(-8deg); }
  .gross { position: fixed; inset: 0; background: rgba(40,20,60,.45); display: grid; place-items: center; z-index: 20; padding: 16px; }
  .gross[hidden] { display: none; }
  .gross .karte { background: #fff; border-radius: 30px; padding: 24px; text-align: center; width: min(420px, 100%); box-shadow: 0 10px 0 rgba(0,0,0,.15); }
  .gross .e { font-size: 7rem; line-height: 1.1; }
  .gross h2 { margin: 6px 0; font-size: 1.8rem; }
  .gross p { font-size: 1.15rem; margin: 6px 0 14px; }
  .gross .ru { background: #FFF6D6; color: #7A4A10; border-radius: 12px; padding: 6px 10px; display: inline-block; }
  .gross .knoepfe { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .gross .knopf { min-height: 54px; }
  .info { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  .info p { margin: 10px 0 0; font-weight: 500; }
</style>
</head>
<body>
<div class="oben">
  <a class="knopf rund" id="zurueck" href="../ich/" aria-label="Zurück">⬅️</a>
  <h1>📒 Stickeralbum</h1>
  <div class="knopf zaehler" id="zaehler"></div>
</div>
<div class="info"><p id="wie"></p></div>
<div class="reiter" id="reiter" role="tablist"></div>
<div class="blatt"><div class="seite" id="seite"></div></div>
<div class="gross" id="gross" hidden><div class="karte" id="gross-karte"></div></div>

<script src="../../shared/config.js"></script>
<script src="../../shared/core.js" data-root="../../"></script>
<script src="../../shared/charakter.js"></script>
<script src="../../shared/echtewelt.js"></script>
<script src="../../shared/zeit.js" data-art="neutral"></script>
<script src="../../shared/sprache.js"></script>
<script src="../../shared/sticker.js"></script>
<script src="album.js"></script>
</body>
</html>
