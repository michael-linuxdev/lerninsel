<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Probe Pixel</title>
<link rel="stylesheet" href="../../shared/style.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #A8DDF5; }
  #buehne { position: fixed; inset: 0; touch-action: none; }
  #buehne canvas { width: 100%; height: 100%; display: block; }
  .leiste { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 2; }
  .leiste .knopf { min-height: 48px; font-size: 1rem; padding: 0 14px; text-decoration: none; display: inline-flex; align-items: center; }
  .leiste .knopf.an { background: var(--pflaume); color: #fff; }
  .mess { position: fixed; left: 10px; bottom: max(10px, env(safe-area-inset-bottom)); right: 10px; background: rgba(255,255,255,.88); border-radius: 10px; padding: 6px 10px; font-size: .85rem; color: var(--pflaume); z-index: 2; width: fit-content; max-width: calc(100% - 40px); }
  .laden { position: fixed; inset: 0; display: grid; place-items: center; font-weight: 700; color: var(--pflaume); }
  .pixelbox { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(54px, calc(env(safe-area-inset-bottom) + 46px)); width: min(560px, calc(100% - 28px)); box-sizing: border-box;
    background: #F8F8F0; color: #30283A; border: 4px solid #30283A; box-shadow: inset 0 0 0 3px #88C8F8, 0 4px 0 rgba(0,0,0,.2); border-radius: 6px; padding: 12px 16px; font: 600 1.1rem/1.4 ui-monospace, Menlo, monospace; z-index: 3; }
  @media (max-width: 600px) { .leiste .knopf { min-height: 44px; font-size: .9rem; padding: 0 10px; } }
</style>
</head>
<body>
<div id="buehne"><div class="laden" id="laden">Lädt …</div></div>
<div class="leiste">
  <a class="knopf" href="../../" aria-label="Zur Startseite">🏠</a>
  <a class="knopf" href="../welt3d/probe.html?stil=b">🐾 Rund</a>
  <a class="knopf an" href="./">👾 Pixel</a>
</div>
<div class="mess" id="mess"></div>
<script type="module">
  import("./pixel.js").then(() => document.getElementById("laden").remove(), (f) => { document.getElementById("laden").textContent = "Fehler: " + f.message; console.error(f); });
</script>
</body>
</html>
