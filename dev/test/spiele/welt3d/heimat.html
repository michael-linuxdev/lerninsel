<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Meine Insel</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #A8DDF5; }
  #buehne { position: fixed; inset: 0; touch-action: none; }
  #buehne canvas { width: 100%; height: 100%; display: block; }
  .leiste { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; gap: 10px; align-items: center; z-index: 2; pointer-events: none; }
  .leiste > * { pointer-events: auto; }
  .leiste .knopf { min-height: 52px; font-size: 1.05rem; padding: 0 16px; text-decoration: none; }
  .leiste .knopf.an { background: var(--pflaume); color: #fff; }
  .leiste .platz { flex: 1; }
  #info { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.92); border-radius: 999px; padding: 10px 20px; font-weight: 600; color: var(--pflaume); z-index: 2; max-width: calc(100% - 270px); text-align: center; }
  #lern-hinweis { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 64px); left: 50%; transform: translateX(-50%); z-index: 2; background: #FFF6D6; color: #7A4A10; border-radius: 18px; padding: 10px 18px; font-weight: 600; max-width: min(620px, calc(100% - 32px)); text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,.1); }
  #lern-hinweis[hidden], #raus[hidden] { display: none; }
  #raus { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(150px, calc(env(safe-area-inset-bottom) + 140px)); z-index: 2; min-height: 56px; font-size: 1.15rem; }
  #springen { position: fixed; right: max(20px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); z-index: 2; width: 100px; height: 100px; border-radius: 50%; background: var(--sonne); font-size: 1.05rem; font-weight: 700; color: var(--pflaume); box-shadow: 0 8px 0 #C79512; touch-action: none; border: 0; }
  #springen:active { transform: translateY(5px); box-shadow: 0 3px 0 #C79512; }
  #springen span { display: block; font-size: 2.2rem; line-height: 1; }
  #springen.aktion { background: #FF8FB8; color: #fff; box-shadow: 0 8px 0 #D45A88; animation: winken 1.4s ease-in-out infinite; }
  #springen.aktion:active { box-shadow: 0 3px 0 #D45A88; }
  @keyframes winken { 0%, 100% { scale: 1; } 50% { scale: 1.07; } }
  @media (prefers-reduced-motion: reduce) { #springen.aktion { animation: none; } }
  #blase { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(560px, calc(100% - 28px)); background: #fff; border-radius: 26px; padding: 18px 20px; box-shadow: 0 10px 0 rgba(0,0,0,.12); z-index: 3; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: start; }
  #blase[hidden] { display: none; }
  #blase-e { font-size: 3rem; line-height: 1; grid-row: span 2; }
  #blase-e svg { width: 84px; height: 84px; display: block; }
  #blase-titel { margin: 0; font-size: 1.35rem; }
  #blase-text { margin: 0; font-size: 1.2rem; line-height: 1.35; font-weight: 500; }
  #blase-ru { grid-column: 2; margin: 0; background: #FFF6D6; color: #7A4A10; border-radius: 12px; padding: 6px 10px; }
  #blase-ru[hidden] { display: none; }
  .blase-knoepfe { grid-column: 1 / -1; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 6px; }
  .blase-knoepfe .knopf { min-height: 54px; font-size: 1.15rem; }
  .blase-knoepfe [hidden] { display: none; }
  #stick { position: fixed; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.35); box-shadow: inset 0 0 0 4px rgba(255,255,255,.85); pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 2; }
  #stick.an { opacity: 1; }
  #knauf { position: absolute; left: 40px; top: 40px; width: 60px; height: 60px; border-radius: 50%; background: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
  #joy-hinweis { position: fixed; left: max(20px, env(safe-area-inset-left)); bottom: max(80px, calc(env(safe-area-inset-bottom) + 70px)); z-index: 2; background: rgba(255,255,255,.88); border-radius: 999px; padding: 10px 16px; font-weight: 600; color: var(--pflaume); pointer-events: none; }
  #joy-hinweis[hidden] { display: none; }
  #einrichten { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(220px, calc(env(safe-area-inset-bottom) + 210px)); z-index: 2; min-height: 56px; font-size: 1.15rem; }
  #einrichten[hidden], #laden[hidden] { display: none; }
  #laden { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 64px); right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); width: min(440px, calc(100% - 28px)); background: #fff; border-radius: 26px; padding: 16px 18px; box-shadow: 0 10px 0 rgba(0,0,0,.12); z-index: 4; overflow-y: auto; }
  .laden-kopf { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .laden-kopf h2 { margin: 0; font-size: 1.3rem; }
  #laden-text { margin: 8px 0 10px; font-weight: 500; }
  #laden h3 { margin: 12px 0 8px; font-size: 1.05rem; }
  #laden .waren { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  #laden .ware { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 3px solid #EFE6FF; background: #FBF8FF; border-radius: 18px; padding: 10px 8px; font: inherit; color: var(--pflaume); min-height: 64px; width: 100%; margin-bottom: 8px; text-align: center; }
  #laden .waren .ware { margin: 0; }
  #laden .ware.hat { border-color: #BDECD8; background: #F1FBF6; }
  #laden .ware.weg { background: #FFF6D6; border-color: #FFE6A0; }
  #laden .ware .e { font-size: 2rem; line-height: 1.1; }
  #laden .ware .e i { display: inline-block; width: 36px; height: 36px; border-radius: 10px; box-shadow: inset 0 0 0 3px rgba(0,0,0,.08); }
  #laden .ware span:last-child { font-size: .95rem; font-weight: 600; opacity: .85; }
</style>
</head>
<body>
<div id="buehne"></div>
<div class="leiste">
  <a class="knopf" href="./" aria-label="Zur 3D-Welt">⬅️</a>
  <div class="knopf">⭐ <b id="sterne">0</b></div>
  <span class="platz"></span>
  <button class="knopf" id="grafik" aria-label="Grafik schön oder einfach">✨ schön</button>
  <button class="knopf" id="steuerung" aria-label="Steuerung Joystick oder Tippen">🕹️ Joystick</button>
  <button class="knopf" id="kamera" aria-label="Kamera fest oder frei">🎥 fest</button>
</div>
<div id="info"></div>
<div id="lern-hinweis" hidden></div>
<button class="knopf" id="raus" hidden>🚪 Nach draußen</button>
<button class="knopf" id="einrichten" hidden>🛋️ Einrichten</button>
<div id="laden" hidden role="dialog" aria-label="Zimmer einrichten">
  <div class="laden-kopf"><h2 id="laden-titel">🛋️ Zimmer einrichten</h2><button class="knopf" id="laden-zu" aria-label="Schließen">✖</button></div>
  <p id="laden-text"></p>
  <div id="laden-liste"></div>
</div>
<button id="springen" aria-label="Springen"><span>⬆️</span>Springen</button>
<div id="stick"><div id="knauf"></div></div>
<div id="joy-hinweis">👆 Hier links schieben zum Laufen · Antippen zum Reden</div>
<div id="blase" hidden role="dialog" aria-live="polite">
  <div id="blase-e"></div>
  <h2 id="blase-titel"></h2>
  <p id="blase-text"></p>
  <p id="blase-ru" lang="ru" hidden></p>
  <div class="blase-knoepfe">
    <button class="knopf" id="blase-ruk" lang="ru">RU</button>
    <button class="knopf" id="blase-zu">Tschüss</button>
    <button class="knopf haupt" id="blase-los">Los geht's!</button>
  </div>
</div>
<script src="../../shared/config.js"></script>
<script src="../../shared/core.js" data-root="../../"></script>
<script src="../../shared/charakter.js"></script>
<script src="../../shared/sticker.js"></script>
<script src="../../shared/zeit.js" data-art="insel"></script>
<script src="../../shared/sprache.js"></script>
<script src="../anziehen/teile.js"></script>
<script src="../anziehen/figur.js"></script>
<script src="../../shared/tiere.js"></script>
<script src="../../shared/tierpflege.js"></script>
<script src="../../shared/figuren.js"></script>
<script>try { if (localStorage.getItem("lerninsel.joystick")) document.getElementById("joy-hinweis").hidden = true; } catch (e) {}</script>
<script type="module" src="heimat.js"></script>
</body>
</html>
