<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Insel-Garten</title>
<meta name="theme-color" content="#E4F6D8">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.webmanifest">

<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">

<style>
  html, body { min-height: 100%; }
  body { background: linear-gradient(#DDF1FF 0 30%, #CFEFC0 30% 100%); background-attachment: fixed; }
  .oben { display: flex; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .oben h1 { margin: 0; font-size: 1.8rem; flex: 1; min-width: 0; }
  .rund { width: 56px; padding: 0; font-size: 1.6rem; flex: none; text-decoration: none; }
  .mitte { max-width: 1040px; margin: 0 auto; padding: 10px 16px 30px; display: grid; gap: 14px; }
  .ella { display: flex; gap: 12px; align-items: center; }
  .ella .figur { font-size: 3.4rem; flex: none; }
  .blase { background: #fff; border-radius: 24px; padding: 12px 18px; font-size: 1.25rem; font-weight: 500; box-shadow: 0 6px 0 rgba(0,0,0,.08); flex: 1; display: flex; gap: 10px; align-items: center; }
  .blase p { margin: 0; flex: 1; line-height: 1.35; }
  .blase .ru { display: block; font-size: 1rem; color: var(--pflaume-hell); margin-top: 4px; }
  .vorlesen { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--himmel); font-size: 1.5rem; }
  .beete { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 700px) { .beete { grid-template-columns: 1fr 1fr; } }
  .beet { background: #8A5A34; border-radius: 26px; padding: 10px; display: grid; gap: 8px; box-shadow: 0 7px 0 rgba(0,0,0,.12); color: #fff; text-align: center; position: relative; }
  .beet .erde { background: repeating-linear-gradient(0deg, #6E4428 0 12px, #7C4E2E 12px 24px); border-radius: 18px; min-height: 130px; display: grid; place-items: center; font-size: 4.2rem; line-height: 1; position: relative; overflow: hidden; }
  .beet[data-art="samen"] .erde span { font-size: 1.6rem; }
  .beet[data-art="keim"] .erde span { font-size: 2.8rem; }
  .beet[data-art="reif"] .erde { box-shadow: inset 0 0 0 5px #FFD84D; }
  .beet[data-art="reif"] .erde span { animation: hupf 1.4s ease-in-out infinite; }
  @keyframes hupf { 50% { transform: translateY(-8px); } }
  .beet .erde .frei { color: #E9D3A6; font-size: 4rem; font-weight: 700; opacity: .8; }
  .beet .name { font-weight: 700; font-size: 1.15rem; min-height: 1.4em; }
  .beet .info { font-size: .98rem; opacity: .95; min-height: 2.5em; }
  .beet .knopf { min-height: 58px; font-size: 1.15rem; }
  .beet .knopf:disabled { opacity: .55; }
  .tropfen { position: absolute; font-size: 1.8rem; animation: tropf .9s ease-in forwards; pointer-events: none; }
  @keyframes tropf { from { transform: translateY(-50px); opacity: 0; } 30% { opacity: 1; } to { transform: translateY(40px); opacity: 0; } }
  .korb { background: #fff; border-radius: 22px; padding: 10px 16px; box-shadow: 0 5px 0 rgba(0,0,0,.06); font-size: 1.2rem; font-weight: 600; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .korb span { background: #F2F8EC; border-radius: 999px; padding: 4px 12px; }
  .zu-oder { text-align: center; }
  .dialog { position: fixed; inset: 0; z-index: 40; background: rgba(75,35,128,.5); display: grid; place-items: center; padding: 20px; }
  .dialog[hidden] { display: none; }
  .dkarte { background: #fff; border-radius: 28px; padding: 22px; width: min(640px, 100%); max-height: calc(100dvh - 40px); overflow: auto; text-align: center; }
  .dkarte h2 { margin: 0 0 8px; font-size: 1.7rem; }
  .dkarte p { font-size: 1.2rem; line-height: 1.4; margin: 0 0 12px; }
  .samen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .samen button { background: #F2F8EC; border-radius: 20px; padding: 10px 6px; display: grid; gap: 2px; font-weight: 700; font-size: 1.05rem; border: 4px solid transparent; }
  .samen button .e { font-size: 2.6rem; }
  .samen button small { font-weight: 500; color: var(--pflaume-hell); }
  .wahl { display: grid; gap: 10px; }
  .wahl .knopf { min-height: 62px; font-size: 1.2rem; }
  .wahl .knopf.falsch { background: #FFD9D4; }
  .wahl .knopf.richtig { background: #CFF2D8; }
  .warum { font-size: 1.1rem; background: #F2F8EC; border-radius: 16px; padding: 10px; margin-top: 10px; }
</style>
</head>
<body>
<div class="oben">
  <a class="knopf rund" href="../welt3d/heimat.html" aria-label="Zur Insel">🏝️</a>
  <h1>🌱 Insel-Garten</h1>
  <div class="knopf sterne">⭐ <b id="sterne">0</b></div>
</div>
<main class="mitte">
  <section class="ella">
    <div class="figur" aria-hidden="true">🦉</div>
    <div class="blase"><p id="ella-text"></p><button class="vorlesen" id="ella-vorlesen" aria-label="Vorlesen">🔊</button></div>
  </section>
  <section class="beete" id="beete" aria-label="Beete"></section>
  <section class="korb" id="korb"></section>
  <section class="zu-oder" id="zu" hidden>
    <div class="blase" style="justify-content:center"><p>🔒 Der Garten wacht auf, wenn auf deinem Wissensbaum die erste Frucht wächst. Lern etwas Neues bei Ella, Fipsi oder Benno!</p></div>
  </section>
</main>
<div class="dialog" id="dialog" hidden><div class="dkarte" id="dkarte" role="dialog"></div></div>

<script src="../../shared/sprache.js"></script>

</body>
</html>
