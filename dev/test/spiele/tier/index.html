<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mein Tier</title>
<meta name="theme-color" content="#E9F7FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  html, body { height: 100%; }
  body { background: linear-gradient(#DDF1FF 0 62%, #CFEFC0 62% 100%); background-attachment: fixed; }
  .oben { display: flex; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); position: relative; z-index: 3; }
  .oben h1 { margin: 0; font-size: 1.8rem; flex: 1; min-width: 0; }
  .rund { width: 56px; padding: 0; font-size: 1.6rem; flex: none; text-decoration: none; }
  .sterne b { font-size: 1.4rem; }
  .ansicht[hidden] { display: none !important; }
  .mitte { max-width: 1000px; margin: 0 auto; padding: 10px 16px 30px; display: grid; gap: 14px; justify-items: center; text-align: center; }
  .blase { position: relative; background: #fff; border-radius: 24px; padding: 14px 22px; font-size: 1.35rem; font-weight: 500; max-width: 560px; box-shadow: 0 6px 0 rgba(0,0,0,.08); }
  .blase::after { content: ""; position: absolute; bottom: -16px; left: 50%; margin-left: -12px; border: 12px solid transparent; border-top: 16px solid #fff; border-bottom: 0; }

  /* Eier wählen */
  .eier { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: 100%; }
  @media (max-width: 760px) { .eier { grid-template-columns: 1fr 1fr; } }
  .ei-wahl { background: #fff; border-radius: 26px; padding: 14px 10px; font-size: 1.25rem; font-weight: 700; box-shadow: 0 7px 0 rgba(0,0,0,.08); display: grid; justify-items: center; gap: 4px; }
  .ei-wahl:active { transform: translateY(4px); }
  .ei-wahl svg { width: 100%; max-width: 170px; height: auto; }
  .ei-wahl span { font-size: 1rem; font-weight: 500; color: var(--pflaume-hell); }

  /* Ei und Tier */
  .bild { position: relative; width: min(440px, 88vw); aspect-ratio: 36 / 32; touch-action: manipulation; }
  .bild svg { width: 100%; height: 100%; overflow: visible; }
  .wackeln svg { animation: eiwackeln 1.8s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes eiwackeln { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-6deg); } 86% { transform: rotate(6deg); } 94% { transform: rotate(-3deg); } }
  .atmen .tier-koerper, .atmen .tier-kopf { animation: atmen 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .atmen .tier-kopf { animation-name: kopfwippen; }
  @keyframes atmen { 50% { transform: scale(1.02, .98); } }
  @keyframes kopfwippen { 50% { transform: translateY(3px) rotate(1deg); } }
  .augen { animation: blinzeln 4.5s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes blinzeln { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .springt svg { animation: springen .7s cubic-bezier(.3,1.5,.5,1); }
  @keyframes springen { 40% { transform: translateY(-60px); } 100% { transform: translateY(0); } }
  .flieger { position: fixed; font-size: 3rem; z-index: 20; pointer-events: none; transition: left .7s cubic-bezier(.5,0,.5,1), top .7s cubic-bezier(.3,-0.4,.6,1), transform .7s, opacity .3s; }
  .herz { position: absolute; font-size: 2rem; pointer-events: none; animation: herz 1.1s ease-out forwards; }
  @keyframes herz { 0% { transform: translateY(0) scale(.4); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-120px) scale(1.2); opacity: 0; } }
  .waerme { display: flex; gap: 10px; justify-content: center; font-size: 2.6rem; }
  .waerme span { filter: grayscale(1); opacity: .35; }
  .waerme span.an { filter: none; opacity: 1; }

  .werte { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 760px; }
  .wert { background: #fff; border-radius: 20px; padding: 10px 14px; text-align: left; font-weight: 600; box-shadow: 0 5px 0 rgba(0,0,0,.06); }
  .wert .balken { height: 14px; border-radius: 999px; background: #EEF0F5; overflow: hidden; margin-top: 6px; }
  .wert .balken span { display: block; height: 100%; border-radius: 999px; transition: width .4s; }
  .wert small { display: block; font-weight: 500; color: var(--pflaume-hell); margin-top: 4px; }
  .aktionen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; max-width: 760px; }
  @media (max-width: 640px) { .aktionen, .werte { grid-template-columns: 1fr 1fr; } }
  .aktionen .knopf { min-height: 78px; flex-direction: column; gap: 0; font-size: 1.15rem; line-height: 1.15; }
  .aktionen .knopf .i { font-size: 1.9rem; }
  .aktionen .knopf:disabled { opacity: .45; }
  .namensschild { display: inline-flex; align-items: center; gap: 10px; background: #fff; border-radius: 999px; padding: 6px 18px; font-size: 1.5rem; font-weight: 700; box-shadow: 0 5px 0 rgba(0,0,0,.08); }
  .namensschild small { font-size: 1rem; color: var(--pflaume-hell); font-weight: 600; }

  .dialog { position: fixed; inset: 0; z-index: 40; background: rgba(75,35,128,.5); display: grid; place-items: center; padding: 20px; }
  .dialog[hidden] { display: none; }
  .dkarte { background: #fff; border-radius: 28px; padding: 24px; width: min(620px, 100%); max-height: calc(100dvh - 40px); overflow: auto; text-align: center; }
  .dkarte h2 { margin: 0 0 10px; font-size: 1.9rem; }
  .dkarte p { font-size: 1.25rem; line-height: 1.4; margin: 0 0 14px; }
  .dkarte input { width: 100%; font: inherit; font-size: 1.8rem; font-weight: 600; text-align: center; padding: 12px; border-radius: 16px; border: 4px solid var(--pflaume-hell); margin-bottom: 12px; -webkit-user-select: text; user-select: text; }
  .vorschlaege { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .vorschlaege button { min-height: 46px; padding: 0 16px; border-radius: 999px; background: var(--himmel); font-weight: 600; font-size: 1.1rem; }
  .dknoepfe { display: grid; gap: 10px; }
  .dknoepfe .knopf { min-height: 60px; font-size: 1.3rem; }
  .zubehoer { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .zb { border-radius: 20px; background: #F6F3FB; padding: 8px; display: grid; gap: 4px; font-weight: 600; border: 4px solid transparent; }
  .zb svg { width: 100%; height: 120px; }
  .zb.an { border-color: var(--beere); background: #FFEAF4; }
  .zb em { font-style: normal; font-size: .95rem; color: var(--pflaume-hell); }
</style>
</head>
<body>
<div class="oben">
  <a class="knopf rund" href="../../" aria-label="Zur Spielwelt">🏠</a>
  <h1 id="titel">Mein Tier</h1>
  <div class="knopf sterne">⭐ <b id="sterne">0</b></div>
</div>

<section class="ansicht mitte" id="wahl-ansicht" hidden>
  <div class="blase">Such dir ein Ei aus! Wer wohnt da wohl drin?</div>
  <div class="eier" id="eier"></div>
</section>

<section class="ansicht mitte" id="ei-ansicht" hidden>
  <div class="blase" id="ei-text"></div>
  <button class="bild wackeln" id="ei-bild" aria-label="Ei"></button>
  <div class="waerme" id="waerme" aria-label="Wärme"></div>
  <p class="klein" id="ei-hilfe" style="font-size:1.15rem;margin:0"></p>
</section>

<section class="ansicht mitte" id="tier-ansicht" hidden>
  <div class="blase" id="tier-text"></div>
  <button class="bild atmen" id="tier-bild" aria-label="Streicheln"></button>
  <div class="namensschild"><span id="tier-name"></span><small id="tier-stufe"></small></div>
  <div class="werte" id="werte"></div>
  <div class="aktionen">
    <button class="knopf" id="fuettern"><span class="i">🍪</span><span id="leckerli">Füttern</span></button>
    <button class="knopf" id="spielen"><span class="i">⚽</span>Spielen</button>
    <button class="knopf" id="zubehoer-auf"><span class="i">🎀</span>Zubehör</button>
    <button class="knopf" id="umbenennen"><span class="i">✏️</span>Name</button>
  </div>
</section>

<div class="dialog" id="dialog" hidden><div class="dkarte" id="dkarte" role="dialog"></div></div>

<script src="../../shared/config.js"></script>
<script src="../../shared/core.js" data-root="../../"></script>
<script src="../../shared/charakter.js"></script>
<script src="../../shared/zeit.js" data-art="spielen"></script>
<script src="../../shared/tiere.js"></script>
<script src="../../shared/tierpflege.js"></script>
<script src="tier.js"></script>
</body>
</html>
