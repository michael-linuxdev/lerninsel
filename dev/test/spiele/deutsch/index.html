<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Abenteuer</title>
<meta name="theme-color" content="#FFE9E2">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  body { background: #FFE9E2; background-image: none; --grund: #FFE9E2; --akzent: var(--koralle); }
  .ansicht[hidden] { display: none !important; }
  .oben { display: flex; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .oben h1 { margin: 0; font-size: 1.7rem; flex: 1; min-width: 0; }
  .rund { width: 56px; padding: 0; font-size: 1.6rem; flex: none; text-decoration: none; }
  .sterne b { font-size: 1.4rem; }

  /* ---------- Karte ---------- */
  #karte-ansicht { min-height: 100dvh; padding-bottom: 30px; }
  .orte { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; padding: 20px 16px 10px; max-width: 1100px; margin: 0 auto; position: relative; }
  .ort {
    position: relative; background: #fff; border-radius: 26px; padding: 16px 8px 12px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    box-shadow: 0 7px 0 rgba(194,74,60,.18); font-weight: 600; font-size: 1.05rem; line-height: 1.15;
  }
  .ort:active { transform: translateY(3px); }
  .ort .emoji { font-size: 3.6rem; line-height: 1.1; }
  .ort .nr { position: absolute; top: 10px; left: 12px; width: 30px; height: 30px; border-radius: 50%; background: var(--grund); display: grid; place-items: center; font-size: .95rem; }
  .ort .stern-reihe { font-size: 1rem; min-height: 1.3em; letter-spacing: 1px; }
  .ort .stern-reihe .leer { filter: grayscale(1); opacity: .3; }
  .ort.zu { background: #F3EDEB; color: #9C8F8B; box-shadow: none; }
  .ort.zu .emoji { filter: grayscale(1); opacity: .45; }
  .ort.jetzt { box-shadow: 0 0 0 5px var(--koralle), 0 7px 0 rgba(194,74,60,.25); }
  @media (max-width: 760px) { .orte { grid-template-columns: repeat(3, 1fr); } }
  .werk-titel { text-align: center; margin: 26px 0 4px; font-size: 1.8rem; }
  .werk-text { text-align: center; margin: 0 16px; font-size: 1.1rem; }
  .orte.werkstatt { padding-bottom: 40px; }
  .klatsch { min-height: 60px; font-size: 1.5rem; padding: 0 26px; margin-bottom: 8px; }
  .silbe { background: #FFE08A; border-radius: 10px; padding: 0 6px; }
  .trenn { color: var(--pflaume-hell); margin: 0 4px; }

  .schatz { max-width: 760px; margin: 14px auto 0; padding: 0 16px; text-align: center; }
  .schatz h2 { margin: 0 0 10px; font-size: 1.5rem; }
  .schatz svg { width: min(520px, 100%); height: auto; }
  .fipsi-start { display: flex; align-items: center; gap: 12px; max-width: 760px; margin: 0 auto; padding: 4px 16px; }
  .fipsi-start svg { width: 96px; flex: none; }
  .fipsi-start p { margin: 0; background: #fff; border-radius: 20px; padding: 12px 18px; font-size: 1.25rem; font-weight: 500; }

  /* ---------- Kapitel ---------- */
  #kapitel-ansicht { height: 100dvh; display: flex; flex-direction: column; background: var(--grund); }
  .fortschritt { flex: 0 0 120px; height: 16px; border-radius: 999px; background: #fff; overflow: hidden; }
  .fortschritt span { display: block; height: 100%; background: var(--akzent); border-radius: 999px; transition: width .3s; }
  .buehne {
    flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(240px, 34%) 1fr; gap: 18px;
    padding: 14px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .erzaehler { display: flex; flex-direction: column; gap: 10px; min-height: 0; justify-content: flex-end; }
  .blase {
    position: relative; background: #fff; border-radius: 26px; padding: 18px 20px;
    font-size: 1.45rem; font-weight: 500; line-height: 1.35; box-shadow: 0 6px 0 rgba(0,0,0,.08);
  }
  .blase::after { content: ""; position: absolute; bottom: -16px; left: 44px; border: 10px solid transparent; border-top: 14px solid #fff; border-bottom: 0; }
  .blase .luecke { display: inline-block; min-width: 3.4em; border-bottom: 4px solid var(--akzent); text-align: center; color: var(--akzent); font-weight: 700; }
  .blase-knoepfe { display: flex; gap: 8px; margin-top: 12px; }
  .klein-knopf { min-height: 48px; padding: 0 16px; border-radius: 999px; background: var(--himmel); font-weight: 600; font-size: 1.1rem; }
  .ru-blase { background: #FFF6D6; border-radius: 18px; padding: 10px 16px; font-size: 1.2rem; line-height: 1.35; box-shadow: inset 0 0 0 3px #FFE08A; }
  .fipsi { width: min(190px, 60%); align-self: center; }
  .fipsi.spricht { animation: sprechen .5s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes sprechen { to { transform: scale(1.03, .98) rotate(-1.5deg); } }

  .aufgabe {
    background: #fff; border-radius: 30px; padding: 22px; min-height: 0; overflow: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    box-shadow: 0 10px 0 rgba(0,0,0,.07); text-align: center;
  }
  .gross-emoji { font-size: clamp(4.5rem, 12vw, 8rem); line-height: 1.05; }
  .optionen { display: grid; gap: 14px; width: 100%; max-width: 720px; }
  .optionen.bilder { grid-template-columns: repeat(3, 1fr); }
  .optionen.texte { grid-template-columns: 1fr; max-width: 520px; }
  .option {
    border-radius: 24px; background: var(--grund); min-height: 76px; padding: 10px 14px;
    font-size: 1.6rem; font-weight: 600; color: var(--pflaume);
    box-shadow: 0 6px 0 rgba(0,0,0,.1); transition: transform .06s;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .option:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.1); }
  .option .emoji { font-size: clamp(3.6rem, 9vw, 6rem); line-height: 1.1; }
  .option .name { font-size: 1.2rem; min-height: 1.3em; }
  .option.richtig { background: #CFF3E4; box-shadow: 0 0 0 5px var(--minze); }
  .option.falsch { background: #FFE1DD; opacity: .55; animation: wackel .35s; }
  .option:disabled { cursor: default; }
  @keyframes wackel { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .artikel-wort { font-size: clamp(2.4rem, 6vw, 3.6rem); font-weight: 700; }
  .artikel-wort .luecke { display: inline-block; min-width: 2.6em; border-bottom: 6px solid var(--pflaume-hell); margin-right: .25em; }
  .optionen.artikel { grid-template-columns: repeat(3, 1fr); max-width: 560px; }
  .optionen.artikel .option { font-size: 2.2rem; color: #fff; min-height: 96px; }
  .optionen.artikel.klar .option { color: var(--pflaume); background: #fff; box-shadow: inset 0 0 0 4px var(--akzent), 0 6px 0 rgba(0,0,0,.1); }
  .optionen.artikel.klar .option.richtig { background: #CFF3E4; }
  .option[data-wert="der"] { background: #3A7BD5; }
  .option[data-wert="die"] { background: #E0457B; }
  .option[data-wert="das"] { background: #2FA66B; }

  .satz-zeile { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 72px; width: 100%; max-width: 720px; padding: 10px; border-radius: 22px; background: var(--himmel); box-shadow: inset 0 0 0 3px #C9D9F5; }
  .satz-zeile.richtig { background: #CFF3E4; box-shadow: inset 0 0 0 3px var(--minze); }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 720px; }
  .chip { min-height: 60px; padding: 0 20px; border-radius: 18px; background: #fff; font-size: 1.6rem; font-weight: 600; color: var(--pflaume); box-shadow: 0 5px 0 rgba(0,0,0,.12), inset 0 0 0 3px #E6DDF5; }
  .chip.weg { visibility: hidden; }
  .chip.falsch { background: #FFE1DD; }
  .pruefen { min-height: 64px; font-size: 1.4rem; padding: 0 34px; }
  .hoeren-knopf { width: 140px; height: 140px; border-radius: 50%; font-size: 4rem; background: var(--grund); box-shadow: 0 8px 0 rgba(0,0,0,.12); }
  .hoeren-knopf:active { transform: translateY(4px); }
  .weiter { min-height: 76px; font-size: 1.6rem; padding: 0 44px; background: var(--pflaume); color: #fff; }
  .hinweis { margin: 0; font-size: 1.3rem; font-weight: 600; min-height: 1.5em; }
  .hinweis.gut { color: #1F8A63; }
  .hinweis.nein { color: #D24A3C; }
  .szene { width: min(360px, 80%); height: auto; }

  @media (orientation: portrait) {
    .buehne { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .erzaehler { flex-direction: row; align-items: flex-end; }
    .erzaehler .fipsi { width: 110px; flex: none; order: -1; }
    .erzaehler .texte-box { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .blase::after { left: -14px; bottom: 26px; border: 10px solid transparent; border-right: 14px solid #fff; border-left: 0; }
  }

  /* ---------- Ende ---------- */
  #ende-ansicht { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
  .ende-karte { background: #fff; border-radius: 32px; padding: 30px; width: min(580px, 100%); text-align: center; box-shadow: 0 12px 0 rgba(0,0,0,.08); }
  .ende-karte h2 { margin: 0 0 6px; font-size: 2.4rem; }
  .ende-karte p { margin: 0 0 8px; font-size: 1.3rem; }
  .teil-gross { width: 150px; height: auto; margin: 8px auto; display: block; animation: plopp .6s cubic-bezier(.3,1.7,.5,1) both; }
  .gross-sterne { display: flex; justify-content: center; gap: 10px; margin: 6px 0; font-size: 3.6rem; }
  .gross-sterne span { display: inline-block; transform: scale(0); animation: plopp .45s cubic-bezier(.3,1.7,.5,1) forwards; }
  .gross-sterne span.leer { filter: grayscale(1); opacity: .25; }
  @keyframes plopp { from { transform: scale(0); } to { transform: scale(1); } }
  .gewinn { display: inline-block; background: #FFF6D6; padding: 8px 18px; border-radius: 999px; font-weight: 600; font-size: 1.2rem; margin: 6px 0 16px; }
  .ende-knoepfe { display: grid; gap: 12px; }
  .ende-knoepfe .knopf { min-height: 62px; font-size: 1.3rem; }

  /* Einstellungen */
  .dialog { position: fixed; inset: 0; z-index: 40; background: rgba(75,35,128,.55); display: grid; place-items: center; padding: 20px; }
  .dialog[hidden] { display: none; }
  .einst { background: #fff; border-radius: 28px; padding: 26px; width: min(560px, 100%); display: grid; gap: 14px; }
  .einst h2 { margin: 0; font-size: 1.9rem; }
  .schalter { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 600; min-height: 60px; padding: 0 16px; border-radius: 18px; background: var(--himmel); }
  .schalter b { padding: 6px 14px; border-radius: 999px; background: #fff; }
  .schalter[aria-pressed="true"] b { background: var(--minze); color: #fff; }
  .stimmen-info { font-size: 1.05rem; line-height: 1.4; margin: 0; color: var(--pflaume-hell); }
</style>
</head>
<body>

<section class="ansicht" id="karte-ansicht">
  <div class="oben">
    <a class="knopf rund" href="../../" aria-label="Zur Spielwelt">🏠</a>
    <h1>Fipsis Schatzkarte</h1>
    <button class="knopf rund" id="einst-auf" aria-label="Einstellungen">⚙️</button>
    <div class="knopf sterne">⭐ <b id="sterne">0</b></div>
  </div>
  <div class="fipsi-start"><span id="fipsi-klein"></span><p id="karte-text"></p></div>
  <div class="orte" id="orte"></div>
  <div class="schatz"><h2 id="schatz-titel">Die Schatzkarte</h2><div id="schatz"></div></div>
  <h2 class="werk-titel">🛠️ Fipsis Wörter-Werkstatt</h2>
  <p class="werk-text">Hier übst du Tunwörter, Wiewörter, Silben und schwierige Buchstaben – so oft du willst.</p>
  <div class="orte werkstatt" id="werkstatt"></div>
</section>

<section class="ansicht" id="kapitel-ansicht" hidden>
  <div class="oben">
    <button class="knopf rund" id="zur-karte" aria-label="Zur Karte">⬅️</button>
    <h1 id="kapitel-name"></h1>
    <div class="fortschritt" aria-hidden="true"><span id="balken"></span></div>
  </div>
  <div class="buehne">
    <div class="erzaehler">
      <div class="texte-box">
        <div class="blase" id="blase" aria-live="polite"></div>
        <div class="ru-blase" id="ru-blase" lang="ru" hidden></div>
      </div>
      <div id="fipsi-gross"></div>
    </div>
    <div class="aufgabe" id="aufgabe"></div>
  </div>
</section>

<section class="ansicht" id="ende-ansicht" hidden>
  <div class="ende-karte">
    <h2 id="ende-titel"></h2>
    <div id="ende-teil"></div>
    <div class="gross-sterne" id="ende-sterne" aria-hidden="true"></div>
    <p id="ende-text"></p>
    <div class="gewinn" id="ende-gewinn"></div>
    <div class="ende-knoepfe" id="ende-knoepfe"></div>
  </div>
</section>

<div class="dialog" id="einst" hidden>
  <div class="einst" role="dialog" aria-label="Einstellungen">
    <h2>Einstellungen</h2>
    <button class="schalter" id="sch-vorlesen" aria-pressed="true">Vorlesen <b>an</b></button>
    <button class="schalter" id="sch-ru" aria-pressed="true">Hilfe auf Russisch <b>an</b></button>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="knopf" id="test-de">🔊 Deutsch testen</button>
      <button class="knopf" id="test-ru">🔊 Russisch testen</button>
    </div>
    <p class="stimmen-info" id="stimmen-info"></p>
    <button class="knopf haupt" id="einst-zu">Fertig</button>
  </div>
</div>

<script src="../../shared/config.js"></script>
<script src="../../shared/core.js" data-root="../../"></script>
<script src="../../shared/ereignisse.js"></script>
<script src="../../shared/charakter.js"></script>
<script src="../../shared/lernfunde.js"></script>
<script src="../../shared/lernkartei.js"></script>
<script src="../../shared/sticker.js"></script>
<script src="../../shared/echtewelt.js"></script>
<script src="../../shared/zeit.js" data-art="lernen"></script>
<script src="../../shared/sprache.js"></script>
<script src="../../shared/daz.js"></script>
<script>if (window.DaZ) DaZ.einstieg();</script>
<script src="geschichte.js"></script>
<script src="werkstatt.js"></script>
<script src="../../shared/koennen.js"></script>
<script src="abenteuer.js"></script>
</body>
</html>
