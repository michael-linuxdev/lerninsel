<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mein Ich</title>
<meta name="theme-color" content="#FFF1E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  body { background: #FFF1E0; background-image: none; }
  .ansicht[hidden] { display: none !important; }
  .oben { display: flex; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .oben h1 { margin: 0; font-size: 1.8rem; flex: 1; }
  .rund { width: 56px; padding: 0; font-size: 1.6rem; flex: none; text-decoration: none; }
  .sterne b { font-size: 1.4rem; }
  .seite { max-width: 1100px; margin: 0 auto; padding: 16px 16px 40px; display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .seite { grid-template-columns: 1fr; } }
  .karte { background: #fff; border-radius: 28px; padding: 20px; box-shadow: 0 8px 0 rgba(160,100,40,.12); }
  .karte h2 { margin: 0 0 12px; font-size: 1.45rem; }
  .spalte { display: grid; gap: 18px; }

  /* Ich */
  .ich { text-align: center; }
  .portraet { width: 220px; height: 250px; margin: 0 auto; border-radius: 26px; background: radial-gradient(circle at 50% 40%, #FFE3F0, #FFD1A8); overflow: hidden; }
  .portraet svg { width: 100%; height: 100%; }
  .ich .name { font-size: 2rem; font-weight: 700; margin: 10px 0 0; }
  .ich .titel { display: inline-block; margin-top: 4px; padding: 4px 14px; border-radius: 999px; background: var(--pflaume); color: #fff; font-weight: 600; }
  .ich .gesamt { margin: 10px 0 0; color: var(--pflaume-hell); font-weight: 600; }
  .vorteile { margin-top: 14px; text-align: left; display: grid; gap: 6px; }
  .vorteile h3 { margin: 0; font-size: 1.1rem; }
  .vorteil { background: #FFF6D6; border-radius: 14px; padding: 8px 12px; font-size: 1rem; font-weight: 500; }
  .klein { font-size: 1rem; color: var(--pflaume-hell); margin: 0; }
  .ich-knoepfe { display: grid; gap: 10px; margin-top: 14px; }
  .ich-knoepfe .knopf { min-height: 54px; font-size: 1.1rem; text-decoration: none; }

  /* Tagesaufgaben */
  .tag-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .tag-kopf p { margin: 0 0 12px; font-weight: 600; color: var(--pflaume-hell); }
  .aufgabe { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 12px; border-radius: 20px; background: #FFF7EE; margin-bottom: 10px; }
  .aufgabe .emoji { font-size: 2.6rem; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 18px; background: #fff; }
  .aufgabe b { display: block; font-size: 1.25rem; }
  .aufgabe span { font-size: 1.05rem; }
  .aufgabe .knopf { min-height: 54px; padding: 0 22px; text-decoration: none; }
  .aufgabe.fertig { background: #E3F7EF; }
  .aufgabe .haken { font-size: 2rem; width: 54px; height: 54px; border-radius: 50%; background: var(--minze); color: #fff; display: grid; place-items: center; }

  /* Heute neu (Lernfunde) */
  .fund { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 18px; background: #EFFAF3; margin-bottom: 8px; animation: fund-rein .5s cubic-bezier(.3,1.4,.5,1) both; }
  .fund .emoji { font-size: 2.2rem; width: 56px; height: 56px; display: grid; place-items: center; border-radius: 16px; background: #fff; }
  .fund b { display: block; font-size: 1.15rem; line-height: 1.3; }
  .fund .fach { font-size: .95rem; color: var(--pflaume-hell); font-weight: 600; }
  .fund .zwei { display: block; margin-top: 4px; padding: 4px 10px; border-radius: 10px; background: #FFF6D6; font-size: 1rem; }
  .fund.gemeistert { background: #FFF1D6; box-shadow: inset 0 0 0 3px #F2C46B; }
  .heute-leer { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 18px; background: #F6F3FB; font-size: 1.1rem; }
  .heute-leer span { font-size: 2.2rem; filter: grayscale(.4); }
  .erzaehl { margin: 10px 0 0; font-size: 1.05rem; font-weight: 600; color: var(--pflaume); }
  @keyframes fund-rein { from { transform: scale(.85); opacity: 0; } }

  /* Kalender */
  .woche { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .tag { text-align: center; padding: 8px 2px; border-radius: 16px; background: #FFF7EE; font-weight: 600; }
  .tag .st { display: grid; place-items: center; width: 42px; height: 42px; margin: 6px auto 0; border-radius: 50%; border: 3px dashed #E7C9A6; font-size: 1.4rem; }
  .tag.gestempelt .st { border: 0; background: var(--beere); color: #fff; }
  .tag.heute { box-shadow: inset 0 0 0 3px var(--pflaume-hell); }
  .truhe { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 12px; border-radius: 20px; background: #FFF6D6; }
  .truhe .gross { font-size: 3rem; }
  .truhe p { margin: 0; font-size: 1.1rem; flex: 1; }
  .truhe .knopf { min-height: 56px; }
  .truhe.bereit .gross { animation: wackeln 1s ease-in-out infinite; }
  @keyframes wackeln { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }

  /* Fähigkeiten */
  .faehigkeiten { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .faehigkeiten { grid-template-columns: 1fr; } }
  .fh { text-align: left; border-radius: 22px; padding: 14px; background: color-mix(in srgb, var(--f) 12%, #fff); box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--f) 35%, #fff); }
  .fh-kopf { display: flex; align-items: center; gap: 10px; }
  .fh-kopf .i { font-size: 2rem; }
  .fh-kopf b { font-size: 1.2rem; flex: 1; }
  .fh-kopf .stufe { background: var(--f); color: #fff; font-weight: 700; border-radius: 999px; padding: 4px 12px; }
  .balken { height: 14px; border-radius: 999px; background: #fff; overflow: hidden; margin: 10px 0 6px; }
  .balken span { display: block; height: 100%; background: var(--f); border-radius: 999px; }
  .fh p { margin: 0; font-size: .98rem; line-height: 1.35; }

  /* Belohnungsliste */
  .dialog { position: fixed; inset: 0; z-index: 40; background: rgba(75,35,128,.5); display: grid; place-items: center; padding: 20px; }
  .dialog[hidden] { display: none; }
  .dkarte { background: #fff; border-radius: 28px; padding: 24px; width: min(560px, 100%); max-height: calc(100dvh - 40px); overflow: auto; }
  .dkarte h2 { margin: 0 0 12px; }
  .stufen { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 6px; }
  .stufen li { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 14px; background: #F6F3FB; font-size: 1.05rem; }
  .stufen li b { width: 74px; flex: none; }
  .stufen li.erreicht { background: #E3F7EF; }
  .dkarte .knopf { width: 100%; min-height: 56px; }

  /* Wort des Tages */
  #wort-ansicht { min-height: 100dvh; }
  .quiz { max-width: 760px; margin: 0 auto; padding: 16px; }
  .quiz .karte { text-align: center; display: grid; gap: 14px; justify-items: center; }
  .riesig { font-size: 7rem; line-height: 1.05; }
  .wort-gross { font-size: 2.6rem; font-weight: 700; }
  .wort-gross .art { color: var(--f, var(--pflaume)); }
  .zeile { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 1.25rem; }
  .ru-box { background: #FFF6D6; border-radius: 14px; padding: 8px 14px; font-size: 1.2rem; }
  .ru-box[hidden] { display: none; }
  .mk { min-width: 50px; height: 50px; border-radius: 999px; background: var(--himmel); font-size: 1.2rem; font-weight: 700; }
  .opts { display: grid; gap: 12px; width: 100%; max-width: 560px; }
  .opts.drei { grid-template-columns: repeat(3, 1fr); }
  .opt { min-height: 76px; border-radius: 22px; background: #FFF7EE; font-size: 1.5rem; font-weight: 700; color: var(--pflaume); box-shadow: 0 6px 0 rgba(0,0,0,.1); }
  .opt.gross-e { font-size: 3.6rem; min-height: 110px; }
  .opt:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.1); }
  .opt.richtig { background: #CFF3E4; box-shadow: 0 0 0 5px var(--minze); }
  .opt.falsch { background: #FFE1DD; opacity: .55; }
  .opt[data-a="der"] { background: #3A7BD5; color: #fff; } .opt[data-a="die"] { background: #E0457B; color: #fff; } .opt[data-a="das"] { background: #2FA66B; color: #fff; }
  .hinweis { min-height: 1.5em; font-size: 1.3rem; font-weight: 600; margin: 0; }
  .quiz-punkte { display: flex; gap: 8px; justify-content: center; }
  .quiz-punkte span { width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 3px #E7C9A6; }
  .quiz-punkte span.an { background: var(--beere); box-shadow: none; }
  .quiz .knopf.weiter { min-height: 68px; font-size: 1.4rem; padding: 0 40px; }
</style>
</head>
<body>

<section class="ansicht" id="haupt-ansicht">
  <div class="oben">
    <a class="knopf rund" href="../../" aria-label="Zur Spielwelt">🏠</a>
    <h1>Mein Ich</h1>
    <div class="knopf sterne">⭐ <b id="sterne">0</b></div>
  </div>
  <div class="seite">
    <div class="spalte">
      <div class="karte ich">
        <div class="portraet" id="portraet"></div>
        <p class="name" id="name"></p>
        <span class="titel" id="titel"></span>
        <p class="gesamt" id="gesamt"></p>
        <div class="vorteile" id="vorteile"></div>
        <div class="ich-knoepfe">
          <a class="knopf" href="../tier/" id="tier-link">🐾 Mein Tier</a>
          <a class="knopf" href="../album/" id="album-link">📒 Stickeralbum</a>
          <a class="knopf" href="../medien/" id="fs-link">🪪 Tablet-Führerschein</a>
          <a class="knopf" href="../anziehen/">👗 Figur anziehen</a>
          <a class="knopf" href="../eltern/">👨‍👩‍👧 Für Eltern</a>
        </div>
      </div>
    </div>
    <div class="spalte">
      <div class="karte">
        <div class="tag-kopf"><h2>Tagesaufgaben</h2><p id="datum"></p></div>
        <div id="aufgaben"></div>
      </div>
      <div class="karte" id="heute-neu-karte">
        <h2>🌱 Heute neu</h2>
        <div id="heute-neu"></div>
      </div>
      <div class="karte">
        <h2>Meine Woche</h2>
        <div class="woche" id="woche"></div>
        <div class="truhe" id="truhe"></div>
      </div>
      <div class="karte">
        <h2>Meine Fähigkeiten</h2>
        <p class="klein" style="margin-bottom:12px">Tippe auf eine Fähigkeit, um alle Belohnungen zu sehen.</p>
        <div class="faehigkeiten" id="faehigkeiten"></div>
      </div>
    </div>
  </div>
</section>

<section class="ansicht" id="wort-ansicht" hidden>
  <div class="oben">
    <button class="knopf rund" id="wort-zurueck" aria-label="Zurück">⬅️</button>
    <h1>Wort des Tages</h1>
    <div class="quiz-punkte" id="quiz-punkte"></div>
  </div>
  <div class="quiz"><div class="karte" id="quiz"></div></div>
</section>

<div class="dialog" id="stufen-dialog" hidden>
  <div class="dkarte" role="dialog" aria-labelledby="stufen-titel">
    <h2 id="stufen-titel"></h2>
    <p class="klein" id="stufen-woher" style="margin-bottom:12px"></p>
    <ul class="stufen" id="stufen-liste"></ul>
    <button class="knopf haupt" id="stufen-zu">Schließen</button>
  </div>
</div>

<script src="../../shared/config.js"></script>
<script src="../../shared/core.js" data-root="../../"></script>
<script src="../../shared/charakter.js"></script>
<script src="../../shared/lernfunde.js"></script>
<script src="../../shared/sticker.js"></script>
<script src="../../shared/zeit.js" data-art="lernen"></script>
<script src="../../shared/sprache.js"></script>
<script src="../../shared/woerter.js"></script>
<script src="../anziehen/teile.js"></script>
<script src="../anziehen/figur.js"></script>
<script src="../../shared/tiere.js"></script>
<script src="../../shared/tierpflege.js"></script>
<script src="../medien/lektionen.js"></script>
<script src="ich.js"></script>
</body>
</html>
