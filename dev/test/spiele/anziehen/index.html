<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Anziehen</title>
<meta name="theme-color" content="#E6EFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .spiel {
    height: 100dvh;
    display: grid; gap: 16px;
    grid-template-columns: minmax(320px, 42%) 1fr;
    padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  }

  /* Bühne mit der Figur */
  .links { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .kopfzeile { display: flex; align-items: center; gap: 12px; }
  .kopfzeile h1 { margin: 0; font-size: 1.6rem; font-weight: 700; line-height: 1.1; flex: 1; min-width: 0; }
  .sterne-anzeige { min-height: 52px; padding: 0 16px; font-size: 1.2rem; flex: none; }
  .sterne-anzeige b { font-size: 1.4rem; margin-left: .2em; }
  .farb-fuer { flex-basis: 100%; text-align: center; font-size: 1rem; font-weight: 600; color: var(--pflaume-hell); }
  .kauf-karte { background: #fff; border-radius: 28px; padding: 26px; width: min(460px, 100%); text-align: center; box-shadow: 0 12px 0 rgba(0,0,0,.15); }
  .kauf-karte h2 { margin: 4px 0 8px; font-size: 1.9rem; }
  .kauf-karte p { font-size: 1.25rem; line-height: 1.45; margin: 0 0 18px; }
  .kauf-bild { width: 150px; height: 150px; margin: 0 auto; background: var(--himmel); border-radius: 24px; padding: 10px; }
  .kauf-bild svg { width: 100%; height: 100%; }
  .kauf-knoepfe { display: grid; gap: 12px; }
  .kauf-knoepfe .knopf { min-height: 62px; font-size: 1.3rem; }
  .kauf-knoepfe .knopf[hidden] { display: none; }
  .heim { min-height: 56px; width: 56px; padding: 0; font-size: 1.6rem; flex: none; }
  .buehnen-rahmen { flex: 1; min-height: 0; display: flex; justify-content: center; padding: 6px; }
  #buehnen-box {
    position: relative; height: 100%; aspect-ratio: 460 / 620; max-width: 100%;
    border-radius: 28px; overflow: hidden;
    box-shadow: 0 0 0 6px #fff, 0 12px 0 6px rgba(75,35,128,.14);
    background: #fff;
  }
  #buehne { width: 100%; height: 100%; display: block; }
  .hopser { transform-box: fill-box; transform-origin: 50% 100%; }
  .hops { animation: hops .35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes hops { 0% { transform: scale(1, 1); } 40% { transform: scale(1.03, .97); } 100% { transform: scale(1, 1); } }
  .funke {
    position: absolute; pointer-events: none;
    color: #FFC83D; font-size: 2rem; text-shadow: 0 0 6px #fff;
    animation: funke .8s ease-out forwards; opacity: 0;
  }
  @keyframes funke { 0% { opacity: 0; transform: scale(.3) rotate(0); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.3) rotate(90deg) translateY(-20px); } }
  #blitz { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #blitz.an { animation: blitz .5s ease-out; }
  @keyframes blitz { 0% { opacity: .95; } 100% { opacity: 0; } }

  .aktionen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .aktionen .knopf { padding: 0 8px; font-size: 1.1rem; min-height: 60px; flex-direction: column; gap: 0; line-height: 1.1; }
  .aktionen .knopf .icon { font-size: 1.5rem; }
  .aktionen .foto { background: var(--beere); color: #fff; }

  /* Auswahl */
  .rechts {
    min-height: 0;
    display: grid; grid-template-columns: 104px 1fr; gap: 14px;
    background: #fff; border-radius: 28px; padding: 14px;
    box-shadow: 0 10px 0 rgba(75,35,128,.12);
  }
  #reiter { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .reiter {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 4px; border-radius: 18px; min-height: 72px;
    font-size: 1rem; font-weight: 600; color: var(--pflaume-hell);
    background: var(--himmel);
  }
  .reiter .icon { font-size: 1.9rem; line-height: 1; }
  .reiter.aktiv { background: var(--pflaume); color: #fff; }

  .auswahl { display: flex; flex-direction: column; min-height: 0; gap: 12px; }
  #teile {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px;
    align-content: start; padding: 4px;
  }
  .teil {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    aspect-ratio: 1 / 1.08; padding: 8px 6px 8px;
    background: var(--himmel); border-radius: 22px;
    font-size: 1rem; font-weight: 600; text-align: center; line-height: 1.1;
    border: 5px solid transparent;
    transition: transform .08s;
  }
  .teil:active { transform: scale(.95); }
  .teil svg { flex: 1; min-height: 0; width: 100%; }
  .teil.ort svg { border-radius: 12px; }
  .teil.aktiv { border-color: var(--beere); background: #FFEAF4; }
  .teil.aktiv::after {
    content: "✓"; position: absolute; top: -8px; right: -8px;
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--beere); color: #fff; font-size: 1.1rem;
    display: grid; place-items: center;
  }
  .teil.zu svg { opacity: .35; filter: grayscale(.6); }
  .teil .preis {
    position: absolute; top: 34%; left: 50%; transform: translateX(-50%);
    font-style: normal; font-weight: 700; font-size: 1.05rem;
    background: #fff; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 3px 0 rgba(75,35,128,.15);
  }
  .teil.nichts span { color: var(--pflaume-hell); }

  #farben { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding-top: 4px; }
  #farben[hidden] { display: none; }
  .farbe {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--f); box-shadow: inset 0 0 0 3px rgba(59,31,99,.25);
    transition: transform .08s;
  }
  .farbe.aktiv { box-shadow: 0 0 0 4px #fff, 0 0 0 8px var(--pflaume); transform: scale(1.08); }

  /* Hochformat (Tablet hochkant) */
  @media (orientation: portrait) {
    .spiel { grid-template-columns: 1fr; grid-template-rows: 58fr 42fr; }
    .rechts { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    #reiter { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }
    .reiter { min-width: 84px; min-height: 66px; }
    #teile { grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); }
    .farbe { width: 46px; height: 46px; }
  }

  /* Kleiderschrank */
  .dialog { position: fixed; inset: 0; z-index: 40; background: rgba(75,35,128,.55); display: grid; place-items: center; padding: 20px; }
  .dialog[hidden] { display: none; }
  .schrank-karte {
    width: min(960px, 100%); max-height: 100%;
    display: flex; flex-direction: column; gap: 14px;
    background: var(--holz); border-radius: 28px; padding: 20px;
    box-shadow: inset 0 0 0 6px #EBC48F, 0 12px 0 #D9A867;
  }
  .schrank-kopf { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .schrank-kopf h2 { margin: 0; font-size: 2rem; }
  #schrank-liste { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; padding: 6px; }
  .look { display: flex; flex-direction: column; gap: 8px; }
  .look .anziehen { padding: 0; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 5px #fff; }
  .look svg { display: block; width: 100%; height: auto; }
  .look-knoepfe { display: flex; gap: 8px; justify-content: center; }
  .mini { width: 52px; height: 48px; border-radius: 14px; background: #fff; font-size: 1.4rem; box-shadow: var(--schatten); }
  .leer { grid-column: 1 / -1; text-align: center; font-size: 1.4rem; padding: 40px 10px; margin: 0; }
</style>
</head>
<body>
<main class="spiel">
  <section class="links">
    <div class="kopfzeile">
      <a class="knopf heim" id="heim-link" href="../../" aria-label="Zur Spielwelt" style="text-decoration:none">🏠</a>
      <script>if (/von=insel/.test(location.search)) { const l = document.getElementById("heim-link"); l.href = "../welt3d/heimat.html?drinnen=1"; l.textContent = "🏡"; l.setAttribute("aria-label", "Zurück ins Zimmer"); }</script>
      <h1 id="titel">Kleiderschrank</h1>
      <div class="knopf sterne-anzeige" aria-label="Deine Sterne">⭐ <b id="sterne-zahl">0</b></div>
    </div>
    <div class="buehnen-rahmen"><div id="buehnen-box">
      <svg id="buehne" viewBox="0 0 460 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Deine Figur"></svg>
      <div id="blitz"></div>
    </div></div>
    <div class="aktionen">
      <button class="knopf" id="zufall"><span class="icon" aria-hidden="true">🎲</span>Zufall</button>
      <button class="knopf" id="neu"><span class="icon" aria-hidden="true">🔄</span>Neu</button>
      <button class="knopf foto" id="foto"><span class="icon" aria-hidden="true">📸</span>Foto</button>
      <button class="knopf" id="schrank-auf"><span class="icon" aria-hidden="true">🚪</span>Schrank</button>
    </div>
  </section>

  <section class="rechts">
    <div id="reiter" role="tablist" aria-label="Kategorien"></div>
    <div class="auswahl">
      <div id="teile"></div>
      <div id="farben" aria-label="Farben"></div>
    </div>
  </section>
</main>

<div class="dialog" id="schrank" hidden>
  <div class="schrank-karte" role="dialog" aria-label="Kleiderschrank">
    <div class="schrank-kopf">
      <h2>Meine Looks</h2>
      <button class="knopf" id="schrank-zu">Schließen</button>
    </div>
    <div id="schrank-liste"></div>
  </div>
</div>

<div class="dialog" id="kauf" hidden>
  <div class="kauf-karte" role="dialog" aria-labelledby="kauf-titel">
    <div class="kauf-bild" id="kauf-bild"></div>
    <h2 id="kauf-titel"></h2>
    <p id="kauf-text"></p>
    <div class="kauf-knoepfe">
      <button class="knopf haupt" id="kauf-ja">Ja, freischalten</button>
      <button class="knopf" id="kauf-nein">Nein, lieber nicht</button>
    </div>
  </div>
</div>

<script src="../../shared/config.js"></script>
<script src="../../shared/core.js" data-root="../../"></script>
<script src="../../shared/charakter.js"></script>
<script src="../../shared/echtewelt.js"></script>
<script src="../../shared/zeit.js" data-art="spielen"></script>
<script src="teile.js"></script>
<script src="figur.js"></script>
<script src="spiel.js"></script>
</body>
</html>
