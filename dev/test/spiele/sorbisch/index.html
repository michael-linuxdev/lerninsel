<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sorbisch</title>
<meta name="theme-color" content="#EAF4FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  body { background: #EAF4FF; background-image: none; --grund: #EAF4FF; --akzent: var(--pflaume-hell); overflow-wrap: break-word; hyphens: auto; }
  .ansicht[hidden] { display: none !important; }
  .oben { display: flex; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .oben h1 { margin: 0; font-size: 1.7rem; flex: 1; min-width: 0; }
  .rund { width: 56px; padding: 0; font-size: 1.6rem; flex: none; text-decoration: none; }
  .sterne b { font-size: 1.4rem; }

  /* Übersicht */
  #liste-ansicht { min-height: 100dvh; padding-bottom: 30px; }
  .intro { display: flex; align-items: center; gap: 14px; max-width: 900px; margin: 10px auto 0; padding: 0 16px; }
  .intro svg { width: 100px; flex: none; }
  .intro p { margin: 0; background: #fff; border-radius: 20px; padding: 14px 18px; font-size: 1.25rem; font-weight: 500; line-height: 1.35; }
  .lektionen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 900px; margin: 18px auto 0; padding: 0 16px; }
  .lek { position: relative; text-align: left; background: #fff; border-radius: 24px; padding: 16px 18px 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center;
    box-shadow: 0 7px 0 rgba(75,35,128,.12); font-weight: 600; font-size: 1.15rem; line-height: 1.2; }
  .lek:active { transform: translateY(3px); }
  .lek .emoji { grid-row: span 2; font-size: 2.6rem; width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: var(--f); }
  .lek .stern-reihe { font-size: .95rem; letter-spacing: 1px; min-height: 1.2em; }
  .lek .stern-reihe .leer { filter: grayscale(1); opacity: .3; }
  .lek.jetzt { box-shadow: 0 0 0 5px var(--pflaume-hell), 0 7px 0 rgba(75,35,128,.18); }
  @media (max-width: 760px) { .lektionen { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 420px) { .lektionen { grid-template-columns: 1fr; } }
  .en-gruppe { max-width: 900px; margin: 0 auto; }
  .en-gruppe h3 { margin: 24px 16px 0; font-size: 1.35rem; }
  .en-gruppe.schule { background: #FFF6D6; border-radius: 26px; padding-bottom: 12px; margin-top: 16px; box-shadow: inset 0 0 0 3px #F3D27A; }
  .schule-marke { font-size: .95rem; background: #F3D27A; border-radius: 12px; padding: 2px 10px; vertical-align: middle; white-space: nowrap; }
  .lernstand-knopf { margin: 10px 16px 0; font-size: 1.05rem; min-height: 48px; }
  .en-gruppe .frueher { margin: 14px 16px 0; }
  .en-gruppe .frueher summary { cursor: pointer; font-weight: 600; padding: 10px 14px; background: #fff; border-radius: 16px; display: inline-block; box-shadow: 0 4px 0 rgba(0,0,0,.06); }
  .en-gruppe .frueher .lektionen { padding: 0; }

  /* Lektion */
  #lektion-ansicht { height: 100dvh; display: flex; flex-direction: column; background: var(--grund); }
  .fortschritt { flex: 0 0 120px; height: 16px; border-radius: 999px; background: #fff; overflow: hidden; }
  .fortschritt span { display: block; height: 100%; background: var(--akzent); border-radius: 999px; transition: width .3s; }
  .buehne { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(240px, 32%) 1fr; gap: 18px; padding: 14px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .erzaehler { display: flex; flex-direction: column; gap: 10px; justify-content: flex-end; min-height: 0; }
  .blase { position: relative; background: #fff; border-radius: 26px; padding: 18px 20px; font-size: 1.4rem; font-weight: 500; line-height: 1.38; box-shadow: 0 6px 0 rgba(0,0,0,.08); overflow: auto; max-height: 60dvh; }
  .blase::after { content: ""; position: absolute; bottom: -16px; left: 44px; border: 10px solid transparent; border-top: 14px solid #fff; border-bottom: 0; }
  .blase-knoepfe { display: flex; gap: 8px; margin-top: 10px; }
  .klein-knopf { min-height: 48px; padding: 0 16px; border-radius: 999px; background: var(--himmel); font-weight: 600; font-size: 1.1rem; }
  .ru-text { margin: 8px 0 0; font-size: 1.15rem; background: #FFF6D6; border-radius: 12px; padding: 8px 12px; color: #7A4A10; }
  .ru-text[hidden] { display: none; }
  .papagei { width: min(170px, 56%); align-self: center; }
  .papagei.spricht { animation: sprechen .45s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes sprechen { to { transform: translateY(-4px) rotate(-2deg); } }
  .aufgabe { background: #fff; border-radius: 30px; padding: 22px; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 16px;
    box-shadow: 0 10px 0 rgba(0,0,0,.07); text-align: center; }
  .aufgabe > :first-child { margin-top: auto; } .aufgabe > :last-child { margin-bottom: auto; } /* zentriert, aber oben scrollbar, wenn es eng wird */
  .gross-emoji { font-size: clamp(4rem, 11vw, 6.5rem); line-height: 1.05; }
  .so-text { display: block; font-weight: 700; color: var(--pflaume); }
  .de-hilfe { display: block; font-size: 1.05rem; font-weight: 500; opacity: .78; margin-top: 6px; }
  .lesetext { background: #FFFDF5; border: 2px solid #EFE3C8; border-radius: 18px; padding: 12px 16px; font-size: 1.3rem; line-height: 1.55; width: 100%; max-width: 620px; box-sizing: border-box; text-align: left; color: #22305A; }
  .gross-emoji.klein { font-size: clamp(2.6rem, 7vw, 4rem); }
  .en-wort { font-size: clamp(2.4rem, 7vw, 3.6rem); font-weight: 700; color: var(--pflaume); }
  .optionen { display: grid; gap: 14px; width: 100%; max-width: 620px; }
  .optionen.bilder { grid-template-columns: repeat(3, 1fr); }
  .optionen.texte { grid-template-columns: 1fr; max-width: 520px; }
  .option { border-radius: 24px; background: var(--grund); min-height: 76px; padding: 10px 14px; font-size: 1.5rem; font-weight: 600; color: var(--pflaume); box-shadow: 0 6px 0 rgba(0,0,0,.1); }
  .option .e { font-size: clamp(3rem, 9vw, 4.6rem); line-height: 1.1; }
  .option:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.1); }
  .option.richtig { background: #CFF3E4; box-shadow: 0 0 0 5px var(--minze); }
  .option.falsch { background: #FFE1DD; opacity: .55; }
  .option:disabled { cursor: default; }
  .hoeren-knopf { width: 130px; height: 130px; border-radius: 50%; font-size: 3.6rem; background: var(--grund); box-shadow: 0 8px 0 rgba(0,0,0,.12); flex: none; }
  .hoeren-knopf:active { transform: translateY(4px); }
  .wortkarten { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; max-width: 760px; }
  .wortkarte { background: var(--grund); border-radius: 20px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 5px 0 rgba(0,0,0,.1); color: var(--pflaume); }
  .wortkarte .e { font-size: 2.4rem; line-height: 1.1; }
  .wortkarte b { font-size: 1.35rem; }
  .wortkarte small { font-size: .95rem; font-weight: 500; opacity: .85; }
  .wortkarte.gehoert { box-shadow: 0 0 0 4px var(--minze), 0 5px 0 rgba(0,0,0,.1); }
  @media (max-width: 700px) { .wortkarten { grid-template-columns: repeat(2, 1fr); } }
  .satz-zeile { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 72px; width: 100%; max-width: 720px; padding: 10px; border-radius: 22px; background: var(--himmel); box-shadow: inset 0 0 0 3px #C9D9F5; }
  .satz-zeile.richtig { background: #CFF3E4; box-shadow: inset 0 0 0 3px var(--minze); }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 720px; }
  .chip { min-height: 60px; padding: 0 20px; border-radius: 18px; background: #fff; font-size: 1.6rem; font-weight: 600; color: var(--pflaume); box-shadow: 0 5px 0 rgba(0,0,0,.12), inset 0 0 0 3px #E6DDF5; }
  .chip.weg { visibility: hidden; }
  .pruefen { min-height: 64px; font-size: 1.4rem; padding: 0 34px; }
  .weiter { min-height: 72px; font-size: 1.5rem; padding: 0 44px; background: var(--pflaume); color: #fff; }
  .hinweis { margin: 0; font-size: 1.3rem; font-weight: 600; min-height: 1.5em; }
  .hinweis.gut { color: #1F8A63; } .hinweis.nein { color: #D24A3C; }
  .hinweis .erklaerung { display: block; font-weight: 500; color: var(--pflaume); margin-top: 4px; }
  @media (orientation: portrait) {
    .buehne { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .erzaehler { flex-direction: row; align-items: flex-end; }
    .erzaehler .papagei { width: 96px; flex: none; order: -1; }
    .blase { flex: 1; max-height: 30dvh; }
    .blase::after { left: -14px; bottom: 26px; border: 10px solid transparent; border-right: 14px solid #fff; border-left: 0; }
    .aufgabe .gross-emoji { font-size: 3.4rem; }
  }

  /* Ende */
  .mitte { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
  .ende-karte { background: #fff; border-radius: 32px; padding: 30px; width: min(580px, 100%); text-align: center; box-shadow: 0 12px 0 rgba(0,0,0,.08); }
  .ende-karte h2 { margin: 0 0 6px; font-size: 2.2rem; }
  .ende-karte p { margin: 0 0 8px; font-size: 1.3rem; }
  .gross-sterne { display: flex; justify-content: center; gap: 10px; margin: 10px 0; font-size: 3.8rem; }
  .gross-sterne span { display: inline-block; transform: scale(0); animation: plopp .45s cubic-bezier(.3,1.7,.5,1) forwards; }
  .gross-sterne span.leer { filter: grayscale(1); opacity: .25; }
  @keyframes plopp { to { transform: scale(1); } }
  .gewinn { display: inline-block; background: #FFF6D6; padding: 8px 18px; border-radius: 999px; font-weight: 600; font-size: 1.2rem; margin: 6px 0 16px; }
  .ende-knoepfe { display: grid; gap: 12px; }
  .ende-knoepfe .knopf { min-height: 62px; font-size: 1.3rem; }
</style>
</head>
<body>

<section class="ansicht" id="liste-ansicht">
  <div class="oben">
    <a class="knopf rund" href="../../" aria-label="Zur Spielwelt">🏠</a>
    <h1>Sorbisch</h1>
    <button class="knopf rund" id="ton-vorlesen" aria-label="Deutsche Erklärungen vorlesen an oder aus">🗣️</button>
    <div class="knopf sterne">⭐ <b id="sterne">0</b></div>
  </div>
  <div class="intro"><span id="paula-klein"></span><p id="intro-text"></p></div>
  <div class="en-liste" id="lektionen"></div>
</section>

<section class="ansicht" id="lektion-ansicht" hidden>
  <div class="oben">
    <button class="knopf rund" id="zur-liste" aria-label="Zur Übersicht">⬅️</button>
    <h1 id="lektion-name"></h1>
    <div class="fortschritt" aria-hidden="true"><span id="balken"></span></div>
  </div>
  <div class="buehne">
    <div class="erzaehler">
      <div class="blase" id="blase" aria-live="polite"></div>
      <div id="paula-gross"></div>
    </div>
    <div class="aufgabe" id="aufgabe"></div>
  </div>
</section>

<section class="ansicht mitte" id="ende-ansicht" hidden>
  <div class="ende-karte">
    <h2 id="ende-titel"></h2>
    <div class="gross-sterne" id="ende-sterne" aria-hidden="true"></div>
    <p id="ende-text"></p>
    <div class="gewinn" id="ende-gewinn"></div>
    <div class="ende-knoepfe" id="ende-knoepfe"></div>
  </div>
</section>

<script src="../../shared/config.js"></script>
<script src="../../shared/core.js" data-root="../../"></script>
<script src="../../shared/ereignisse.js"></script>
<script src="../../shared/charakter.js"></script>
<script src="../../shared/lernfunde.js"></script>
<script src="../../shared/lernkartei.js"></script>
<script src="../../shared/sticker.js"></script>
<script src="../../shared/echtewelt.js"></script>
<script src="../../shared/zeit.js" data-art="lernen"></script>
<script src="../../shared/sprache.js"></script>
<script src="../../shared/figuren.js"></script>
<script src="lektionen.js"></script>
<script src="mutter.js"></script>
<script src="geprueft.js"></script>
<script src="../../shared/koennen.js"></script>
<script src="sorbisch.js"></script>
</body>
</html>
