<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mein Heft</title>
<meta name="theme-color" content="#FFF8E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  body { background: #FFF8E8; background-image: none; overflow-wrap: break-word; }
  .oben { display: flex; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .oben h1 { margin: 0; font-size: 1.8rem; flex: 1; min-width: 0; }
  .rund { width: 56px; padding: 0; font-size: 1.6rem; flex: none; text-decoration: none; }
  .reiter { display: flex; gap: 8px; padding: 14px 16px 4px; max-width: 1000px; margin: 0 auto; flex-wrap: wrap; }
  .reiter button { font: inherit; font-weight: 600; font-size: 1.1rem; border: 0; border-radius: 999px; padding: 10px 18px; min-height: 52px; background: #fff; color: var(--pflaume); box-shadow: 0 4px 0 rgba(160,100,40,.12); }
  .reiter button.an { background: var(--pflaume); color: #fff; }
  .blatt { max-width: 1000px; margin: 10px auto 40px; padding: 0 16px; display: grid; gap: 16px; }
  /* Heftseite mit Linien */
  .seite { background: #fff repeating-linear-gradient(transparent 0 37px, #D7E6F5 37px 39px); border-radius: 22px; padding: 18px 20px 20px 54px; position: relative; box-shadow: 0 6px 0 rgba(160,100,40,.12); }
  .seite::before { content: ""; position: absolute; left: 36px; top: 0; bottom: 0; width: 2px; background: #F2B8B8; }
  .seite .kopf { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 600; color: var(--pflaume-hell); font-size: .98rem; }
  .seite .kopf .e { font-size: 1.6rem; }
  .seite .aufgabe { margin: 6px 0 4px; font-weight: 600; color: var(--pflaume); }
  .seite .text { font-size: 1.45rem; line-height: 39px; white-space: pre-wrap; margin: 0; color: #22305A; }
  .seite .knoepfe { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .seite audio { width: 100%; max-width: 420px; margin-top: 8px; }
  .leer { text-align: center; background: #fff; border-radius: 22px; padding: 28px 18px; box-shadow: 0 6px 0 rgba(160,100,40,.12); }
  .leer .gross { font-size: 4rem; }
  .leer p { font-size: 1.2rem; margin: 8px 0 16px; }
</style>
</head>
<body>
<div class="oben">
  <a class="knopf rund" href="../ich/" aria-label="Zurück">⬅️</a>
  <h1>📓 Mein Heft</h1>
</div>
<div class="reiter" role="tablist">
  <button id="r-text" class="an" role="tab">✏️ Meine Texte <span id="n-text"></span></button>
  <button id="r-ton" role="tab">🎙️ Meine Aufnahmen <span id="n-ton"></span></button>
</div>
<div class="blatt" id="blatt"></div>

<script src="../../shared/config.js"></script>
<script src="../../shared/core.js" data-root="../../"></script>
<script src="../../shared/ereignisse.js"></script>
<script src="../../shared/charakter.js"></script>
<script src="../../shared/echtewelt.js"></script>
<script src="../../shared/zeit.js" data-art="neutral"></script>
<script src="../../shared/sprache.js"></script>
<script src="../deutsch/werkstatt.js"></script>
<script src="../../shared/eigenes.js"></script>
<script src="heft.js"></script>
</body>
</html>
